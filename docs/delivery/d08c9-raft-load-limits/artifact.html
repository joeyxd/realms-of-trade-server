<style>
/* styles/vars.css */
/* Single committed look (nautical wood + brass over a turquoise sea): one theme on purpose,
   every color is still a token so the HUD stays consistent. */
:root {
  color-scheme: dark;
  --ink: #1a1033;
  --sea-deep: #0b1630;
  --sea: #0f5f8c;
  --wood: #7a4a26;
  --wood-l: #a8703e;
  --wood-d: #45280f;
  --brass: #e7bb4f;
  --brass-l: #ffe39a;
  --brass-d: #94681e;
  --parch: #fbf0d6;
  --parch-d: #e3cfa2;
  --text: #fff6e2;
  --text-dim: #d9c6a0;
  --accent: #3bf0ff;
  --hp: #ff4d5e;
  --hp-d: #9e1b2e;
  --en: #36c9ff;
  --xp: #ffc23d;
  --good: #7be07b;
  --warn: #ffb02e;
  --r-common: #9aa3ad;
  --r-uncommon: #4cd964;
  --r-rare: #3fa9ff;
  --r-epic: #b36bff;
  --r-legend: #ffc23d;
  --shadow: rgba(10, 6, 24, 0.55);
  --glass: rgba(20, 12, 40, 0.55);

  --font-display: 'Lilita One', 'Titan One', 'Arial Black', system-ui, sans-serif;
  --font-ui: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --ui-scale: 1;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
/* Rotated stage (M4.6): its top is the physical right edge, its left the physical top, and so on. */
body.rotated {
  --safe-l: env(safe-area-inset-top, 0px);
  --safe-t: env(safe-area-inset-right, 0px);
  --safe-r: env(safe-area-inset-bottom, 0px);
  --safe-b: env(safe-area-inset-left, 0px);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--sea-deep);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}
/* The stage holds the canvas, the UI and the fade; stage.js sizes it in px and rotates it 90° on an upright phone.
   Layout containment makes it the containing block of the fixed children either way; @container stage / cqw / cqh
   replace the viewport media queries and units. */
#stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; container-type: size; container-name: stage; }
/* Opaque backing: three.js always asks for an alpha drawing buffer, and FX blends that lower the alpha (the glow
   mask on medium/high) would let the page show through on low, where they draw straight to the canvas. */
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #000; }
#ui { position: fixed; inset: 0; pointer-events: none; font-size: calc(15px * var(--ui-scale)); }
#ui .interactive, #ui button, #ui input, #ui select, #ui label { pointer-events: auto; }
[hidden] { display: none !important; }

/* Shared nautical frame: beveled wood, brass rim, inner shadow. */
.frame {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.12)),
    repeating-linear-gradient(90deg, var(--wood) 0 22px, #6f4222 22px 24px, var(--wood) 24px 47px, #81502b 47px 48px);
  border: 3px solid var(--brass-d);
  border-radius: 14px;
  box-shadow:
    inset 2px 2px 0 rgba(255, 228, 170, 0.35),
    inset -2px -3px 0 rgba(40, 18, 4, 0.55),
    inset 0 0 18px rgba(20, 8, 0, 0.45),
    0 0 0 2px var(--ink),
    0 6px 0 var(--ink),
    0 10px 24px var(--shadow);
}
.frame-dark {
  background: linear-gradient(180deg, rgba(36, 22, 60, 0.82), rgba(20, 12, 36, 0.86));
  border: 2px solid var(--brass-d);
  border-radius: 12px;
  box-shadow: inset 1px 1px 0 rgba(255, 228, 170, 0.22), inset -1px -2px 0 rgba(0, 0, 0, 0.5), 0 0 0 2px var(--ink), 0 4px 14px var(--shadow);
}
.btn {
  font-family: var(--font-display);
  font-size: 1.15em;
  letter-spacing: 0.04em;
  color: var(--ink);
  background: linear-gradient(180deg, var(--brass-l), var(--brass) 45%, var(--brass-d));
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 0.5em 1.3em 0.55em;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.65), inset 0 -3px 0 rgba(90, 50, 10, 0.5), 0 4px 0 var(--ink);
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.15s ease;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
}
.btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 0 rgba(90, 50, 10, 0.5), 0 1px 0 var(--ink); }
.btn:disabled { filter: grayscale(0.7) brightness(0.8); cursor: default; }
.btn:focus-visible, .icon-btn:focus-visible, .skin-dot:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.btn.secondary {
  color: var(--text);
  background: linear-gradient(180deg, var(--wood-l), var(--wood) 55%, var(--wood-d));
  text-shadow: 0 2px 0 var(--ink);
  box-shadow: inset 0 2px 0 rgba(255, 220, 160, 0.35), inset 0 -3px 0 rgba(30, 12, 0, 0.5), 0 4px 0 var(--ink);
}
.icon-btn {
  width: 2.6em; height: 2.6em;
  display: grid; place-items: center;
  color: var(--parch);
  background: linear-gradient(180deg, var(--wood-l), var(--wood-d));
  border: 2px solid var(--ink);
  border-radius: 50%;
  box-shadow: inset 0 0 0 2px var(--brass-d), inset 0 2px 0 rgba(255, 220, 160, 0.4), 0 3px 0 var(--ink);
  cursor: pointer;
  padding: 0;
}
.icon-btn svg { width: 1.3em; height: 1.3em; }
.display { font-family: var(--font-display); letter-spacing: 0.02em; }
.outlined {
  color: var(--parch);
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink),
    2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 5px 0 var(--ink);
}
.kbd {
  display: inline-grid; place-items: center;
  min-width: 1.7em; height: 1.6em; padding: 0 0.35em;
  font-family: var(--font-ui); font-weight: 900; font-size: 0.78em;
  color: var(--ink);
  background: linear-gradient(180deg, #fffaf0, var(--parch-d));
  border: 2px solid var(--ink);
  border-radius: 6px;
  box-shadow: 0 2px 0 var(--ink);
}
#fade { position: fixed; inset: 0; background: #000; pointer-events: none; z-index: 50; }

/* styles/title.css */
#title {
  position: fixed; inset: 0;
  display: grid; justify-items: center;
  padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  background: radial-gradient(ellipse at 50% 38%, rgba(11, 22, 48, 0) 30%, rgba(11, 22, 48, 0.55) 100%);
  z-index: 20;
}
.title-card {
  display: grid; justify-items: center; align-content: space-between;
  grid-template-rows: auto 1fr auto; gap: 10px;
  max-width: 760px; width: 100%; height: 100%;
  min-height: 0;
  padding-block: 2cqh 4cqh;
}
.title-head { display: grid; justify-items: center; gap: 10px; }
.title-logo {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(48px, min(12cqw, 14cqh), 124px);
  line-height: 0.92;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0 0.28em;
  text-align: center;
}
.title-logo .word { display: inline-flex; white-space: nowrap; }
.title-logo .ch {
  display: inline-block;
  color: #fff3c9;
  background: linear-gradient(180deg, #fffbe8 0%, #ffe08a 45%, #f3a63a 75%, #c96a1e 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 0.05em var(--ink);
  paint-order: stroke fill;
  filter: drop-shadow(0 0.07em 0 var(--ink)) drop-shadow(0 0.16em 0.12em rgba(10, 6, 24, 0.5));
  transform-origin: 50% 90%;
}
.title-logo .word.black .ch {
  background: linear-gradient(180deg, #e3f7ff 0%, #7fe3ff 40%, #1aa5d6 75%, #155a9c 100%);
  -webkit-background-clip: text; background-clip: text;
}
.title-sub {
  font-family: var(--font-display);
  font-size: clamp(16px, 3.6cqw, 24px);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: center;
}
.rope {
  width: min(420px, 80%); height: 10px;
  background: repeating-linear-gradient(115deg, #d9b26d 0 6px, #a87b3c 6px 10px);
  border-radius: 6px;
  box-shadow: 0 0 0 2px var(--ink), 0 3px 0 var(--ink);
}
.title-actions { display: grid; justify-items: center; gap: 18px; margin-top: 6px; }
#btn-play { font-size: clamp(22px, 5cqw, 30px); padding: 0.45em 2.2em 0.5em; }
#btn-play .loading { font-size: 0.6em; letter-spacing: 0.06em; }
.title-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.skin-picker { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 10px 16px; }
.skin-picker .label { font-family: var(--font-display); letter-spacing: 0.05em; margin-right: 4px; }
.skin-dot {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid var(--ink);
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.4), inset 0 -4px 0 rgba(0, 0, 0, 0.25), 0 3px 0 var(--ink);
  cursor: pointer; padding: 0;
  transition: transform 0.12s ease;
}
.skin-dot[aria-pressed='true'] { transform: scale(1.18); box-shadow: 0 0 0 3px var(--brass), inset 0 3px 0 rgba(255, 255, 255, 0.4), 0 3px 0 var(--ink); }
.skin-dot.has-portrait { width: 48px; height: 48px; }
.skin-name { min-width: 6em; font-weight: 800; color: var(--text-dim); }
.title-foot {
  position: fixed; left: 0; right: 0; bottom: calc(10px + var(--safe-b));
  display: flex; justify-content: space-between; gap: 12px; padding: 0 16px;
  font-size: 12px; color: var(--text-dim); text-shadow: 0 1px 0 var(--ink);
}
.title-net { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; margin-bottom: -6px; }
.net-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 14px 6px; border-radius: 999px;
  font-weight: 900; font-size: 13px; letter-spacing: 0.04em; color: var(--parch);
  background: rgba(20, 12, 36, 0.78); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.net-pill i { width: 9px; height: 9px; border-radius: 50%; background: #9aa3b8; box-shadow: 0 0 0 2px var(--ink); }
.net-pill.online i { background: #4dff9a; box-shadow: 0 0 0 2px var(--ink), 0 0 8px #4dff9a; }
.net-pill.full i { background: #ffb13d; box-shadow: 0 0 0 2px var(--ink), 0 0 8px #ffb13d; }
.link-btn {
  font: 900 13px var(--font-ui); color: var(--accent); background: none; border: 0; padding: 4px 2px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px; text-shadow: 0 2px 0 var(--ink);
}
.link-btn:focus-visible, .name-field input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.title-who { display: flex; gap: 12px; align-items: stretch; justify-content: center; flex-wrap: wrap; }
.name-field { display: flex; gap: 10px; align-items: center; padding: 8px 14px; }
.name-field .label { font-family: var(--font-display); letter-spacing: 0.05em; }
.name-field input {
  width: 7.5em; font: 800 16px var(--font-ui); color: var(--ink);
  background: linear-gradient(180deg, #fffaf0, var(--parch-d)); border: 2px solid var(--ink); border-radius: 8px;
  padding: 4px 10px; box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.12);
}
.title-msg { max-width: 34em; text-align: center; font-weight: 800; font-size: 14px; color: #ffd27a; text-shadow: 0 2px 0 var(--ink); }
.title-hint { font-weight: 800; font-size: 13px; text-align: center; color: var(--parch); text-shadow: 0 2px 0 var(--ink); }
@container stage (max-height: 640px) { .title-actions { gap: 12px; } .skin-dot.has-portrait { width: 42px; height: 42px; } }
@container stage (max-width: 520px) { .title-card { gap: 12px; } .skin-dot { width: 32px; height: 32px; } .skin-dot.has-portrait { width: 42px; height: 42px; } }
@container stage (max-height: 450px) {
  .title-card { padding-block: 0; gap: 4px; }
  .title-head { gap: 5px; }
  .title-logo { font-size: clamp(36px, 12cqh, 56px); }
  .title-sub { font-size: 16px; }
  .rope { height: 6px; }
  .title-actions { gap: 8px; }
  #btn-play { font-size: 22px; padding: 0.35em 1.8em; }
  .skin-picker { padding: 6px 12px; }
  .skin-dot.has-portrait { width: 36px; height: 36px; }
  .title-hint { font-size: 11px; }
  .title-msg { max-width: 100%; margin-top: 8px; font-size: 12px; }
}

/* styles/account.css */
/* Printed comic dossier: hard ink, halftone, sunburnt paper and a cyan registration stamp. */
.account-launch { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; max-width: min(92vw, 42em); }
.account-open { display: inline-flex; align-items: center; gap: 7px; border: 3px solid #161626; border-radius: 3px; padding: 7px 12px; color: #161626; background: #ffc53b; box-shadow: 3px 3px 0 #161626; font: 900 13px var(--font-ui); cursor: pointer; }
.account-open span { font-size: 17px; }
.account-status { max-width: min(76vw, 32em); color: var(--parch); font-size: 12px; font-weight: 800; text-align: center; text-shadow: 0 2px 0 var(--ink); overflow-wrap: anywhere; }
.account-overlay[hidden] { display: none; }
.account-overlay { --account-ink: #161626; --account-paper: #fff2d1; --account-yellow: #ffc53b; --account-cyan: #51dbdf; position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: radial-gradient(ellipse at 50% 40%, #172637ae, #080a18ed); backdrop-filter: blur(8px) saturate(.65); touch-action: pan-y; }
.account-dialog { position: relative; width: min(100%, 900px); max-height: 100%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #bd9453 var(--account-paper); border: 5px solid var(--account-ink); border-radius: 3px 14px 3px 3px; color: var(--account-ink); background: var(--account-paper); box-shadow: 9px 9px 0 var(--account-ink), 12px 12px 0 #ffc53b, 0 32px 100px #0008; animation: accountArrive .22s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain; }
.account-masthead { display: flex; align-items: center; justify-content: space-between; gap: 15px; min-height: 56px; padding: 8px 13px 8px 20px; border-bottom: 4px solid var(--account-ink); background: var(--account-ink); color: #fff2d1; }
.account-brand { font: 400 20px/.95 var(--font-display); letter-spacing: -.02em; transform: rotate(-2deg); white-space: nowrap; }
.account-brand b { color: var(--account-cyan); font-weight: inherit; }
.account-steps { display: flex; align-items: center; gap: 12px; font: 900 11px var(--font-ui); letter-spacing: .06em; }
.account-steps > span { color: #a6a5ae; }
.account-steps b { margin-left: 3px; }
.account-step-account { color: var(--account-yellow) !important; }
.account-dialog[data-screen=pirate] .account-step-pirate { color: var(--account-cyan); }
.account-dialog[data-screen=pirate] .account-step-account { color: #a6a5ae !important; }
.account-close { flex: 0 0 auto; width: 36px; height: 36px; display: grid; place-items: center; border: 2px solid #080a15; border-radius: 3px; background: #fff2d1; color: #161626; font: 900 27px/1 var(--font-ui); cursor: pointer; }
.account-layout { display: grid; grid-template-columns: minmax(0, .86fr) minmax(0, 1fr); }
.account-masthead { position: sticky; top: 0; z-index: 3; }
.account-cover-mobile { display: none; }
.account-cover { position: relative; isolation: isolate; display: flex; flex-direction: column; align-items: flex-start; overflow: hidden; min-height: 500px; padding: 28px 30px 24px; border-right: 5px solid var(--account-ink); background: radial-gradient(circle at 14% 20%, #fff397 0, transparent 48%), linear-gradient(152deg, #ffc53b 25%, #f5a933 65%, #ef7141); }
.account-cover::before { content: ''; position: absolute; z-index: -1; inset: 0; opacity: .25; background: radial-gradient(#38242b 1.2px, transparent 1.4px) 0 0 / 7px 7px; mask-image: linear-gradient(155deg, transparent 30%, #000 90%); }
.account-cover::after { content: ''; position: absolute; z-index: -1; width: 500px; height: 500px; left: -110px; top: -80px; background: repeating-conic-gradient(from 8deg, #fff4b340 0deg 8deg, transparent 8deg 20deg); }
.account-cover-label { padding: 5px 9px; border: 2px solid var(--account-ink); background: var(--account-paper); box-shadow: 3px 3px 0 var(--account-ink); font: 900 10px var(--font-ui); letter-spacing: .12em; transform: rotate(-3deg); }
.account-crest { width: 124px; height: 124px; align-self: center; margin: 18px 0 8px; filter: drop-shadow(4px 6px 0 #16162635); transform: rotate(7deg); }
.account-crest svg { display: block; width: 100%; height: 100%; }
.account-cover h3 { margin: 7px 0 0; font: 400 clamp(36px, 4.2vw, 55px)/.96 var(--font-display); letter-spacing: -.015em; transform: rotate(-3deg); }
.account-cover h3 em { color: #fff8e4; font-style: normal; -webkit-text-stroke: 2px #161626; paint-order: stroke fill; text-shadow: 3px 4px 0 #161626; }
.account-cover-tag { margin: 17px 0 0; padding: 6px 12px; color: #fff2d1; background: #161626; font: 400 22px/1 var(--font-display); transform: rotate(-3deg); box-shadow: 4px 4px 0 #ed5b41; }
.account-cover > p { margin: 24px 0; font: 900 14px/1.4 var(--font-ui); }
.account-issue { margin-top: auto; font: 900 9px var(--font-ui); letter-spacing: .14em; border-top: 2px solid #161626; padding-top: 12px; width: 100%; }
.account-content { min-width: 0; padding: 29px 32px 23px; background: radial-gradient(#b28d4c22 .7px, transparent .8px) 0 0 / 4px 4px, #fff2d1; }
.account-kicker { display: inline-block; color: #57514a; font: 900 10px var(--font-ui); letter-spacing: .14em; }
.account-content h2 { margin: 9px 0 10px; font: 400 clamp(30px, 3.8vw, 44px)/.95 var(--font-display); letter-spacing: -.02em; }
.account-copy { margin: 0 0 20px; color: #57514a; font-size: 13px; font-weight: 800; line-height: 1.4; }
.account-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 3px; border: 3px solid #161626; background: #dccbab; margin: 0 0 18px; }
.account-tab { min-height: 36px; border: 0; padding: 5px 7px; background: transparent; color: #514b47; font: 900 12px var(--font-ui); cursor: pointer; }
.account-tab[aria-pressed=true] { color: #fff2d1; background: #161626; box-shadow: 2px 2px 0 #947c54; }
.account-dialog[data-screen=signup] .account-tab[aria-pressed=true] { color: #161626; background: #51dbdf; box-shadow: 2px 2px 0 #161626; }
.account-form { display: grid; gap: 15px; }
.account-field { display: grid; gap: 6px; min-width: 0; color: #161626; font: 900 11px var(--font-ui); letter-spacing: .035em; }
.account-field > span:first-child { text-transform: uppercase; }
.account-field input { min-width: 0; width: 100%; min-height: 44px; padding: 10px 12px; border: 3px solid #161626; border-radius: 2px; color: #161626; background: #fffaf0; box-shadow: 3px 3px 0 #d2b98a; font: 800 16px var(--font-ui); letter-spacing: 0; user-select: text; -webkit-user-select: text; }
.account-field input::placeholder { color: #82776b; font-size: 13px; font-weight: 700; }
.account-password { position: relative; display: flex; min-width: 0; }
.account-password input { padding-right: 81px; }
.account-password-toggle { position: absolute; right: 5px; top: 5px; bottom: 5px; min-width: 58px; padding: 3px 5px; border: 0; border-left: 2px solid #d7cdb9; background: #fffaf0; color: #545057; font: 900 9px var(--font-ui); cursor: pointer; }
.account-password-hint { margin: -3px 0; color: #686057; font-size: 11px; line-height: 1.4; font-weight: 700; }
.account-submit, .account-primary { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 49px; margin-top: 3px; padding: 11px 16px; border: 3px solid #161626; border-radius: 2px; color: #161626; background: #ffc53b; box-shadow: 4px 5px 0 #161626; font: 400 19px/1.1 var(--font-display); letter-spacing: .035em; text-align: left; cursor: pointer; transition: transform .12s, box-shadow .12s, background .12s; }
.account-submit i, .account-primary i { font: 900 24px/1 var(--font-ui); font-style: normal; }
.account-dialog[data-screen=signup] .account-submit { background: #51dbdf; }
.account-dialog button:hover:not(:disabled) { filter: brightness(1.06); }
.account-submit:hover:not(:disabled), .account-primary:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 6px 0 #161626; }
.account-submit:active:not(:disabled), .account-primary:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 2px 0 #161626; }
.account-text-button { border: 0; padding: 6px 0; color: #4a4645; background: none; font: 900 11px var(--font-ui); text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }

.account-confirmation h3 { margin: 8px 0 12px; font: 400 24px/1 var(--font-display); }

.account-character-preview { display: flex; align-items: center; gap: 14px; }
.account-character-art { position: relative; flex: 0 0 88px; height: 88px; display: grid; place-items: center; overflow: hidden; border: 3px solid #161626; background: repeating-conic-gradient(#51dbdf 0deg 15deg, #91e9dc 15deg 30deg); box-shadow: 4px 4px 0 #161626; transform: rotate(-3deg); }

.account-look-art img { position: relative; z-index: 1; display: block; width: 100%; height: 100%; object-fit: cover; }
.account-look-art i { position: absolute; font-size: 25px; }
.account-look-name { display: block; margin-top: 7px; font: 900 9px/1.2 var(--font-ui); overflow-wrap: anywhere; }
.account-look[aria-pressed=true] { color: #161626; }
.account-look[aria-pressed=true] .account-look-art { box-shadow: 0 0 0 3px #ffc53b, 3px 4px 0 #161626; transform: translateY(-3px); }
.account-look[aria-pressed=true] .account-look-art::after { content: '✓'; position: absolute; z-index: 2; bottom: 0; right: 0; width: 18px; height: 18px; display: grid; place-items: center; color: #161626; background: #ffc53b; border-top: 2px solid #161626; border-left: 2px solid #161626; font: 900 12px/1 var(--font-ui); }
.account-import { padding: 10px 11px; border: 2px dashed #9b8058; background: #efdebb; }

.account-signed-footer { display: flex; align-items: center; gap: 12px; justify-content: space-between; }

/* styles/hud.css */
#hud { position: fixed; inset: 0; pointer-events: none; }

/* Top-left: portrait + bars */
.hud-player {
  position: absolute; left: calc(14px + var(--safe-l)); top: calc(12px + var(--safe-t));
  display: flex; gap: 10px; align-items: center;
  transform-origin: top left; transform: scale(var(--ui-scale));
}
.portrait {
  position: relative; width: 74px; height: 74px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #2b6d9c, #12345a);
  border: 4px solid var(--brass);
  box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 2px var(--brass-d), 0 5px 0 var(--ink), 0 8px 16px var(--shadow);
  overflow: hidden;
}
.portrait canvas { width: 100%; height: 100%; display: block; }
.lvl-badge {
  position: absolute; right: -6px; bottom: -4px;
  min-width: 30px; height: 30px; padding: 0 6px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 16px; color: var(--ink);
  background: linear-gradient(180deg, var(--brass-l), var(--brass) 55%, var(--brass-d));
  border: 2px solid var(--ink); border-radius: 15px; box-shadow: 0 2px 0 var(--ink);
}
.bars { display: grid; gap: 5px; min-width: 200px; }
.pname { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.03em; line-height: 1; }
.bar {
  position: relative; height: 15px; width: 210px;
  background: rgba(20, 10, 30, 0.75);
  border: 2px solid var(--ink); border-radius: 8px;
  box-shadow: 0 2px 0 var(--ink), inset 0 2px 4px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}
.bar.thin { height: 13px; width: 180px; }
.bar.thin .num { font-size: 9.5px; }
.bar .ghost, .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.bar .ghost { background: #fff3c9; opacity: 0.85; transition: width 0.5s ease 0.35s; }
.bar .fill { box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.2); transition: width 0.12s ease; }
.bar.hp .fill { background: linear-gradient(180deg, #ff8a95, var(--hp) 60%, var(--hp-d)); }
.bar.en .fill { background: linear-gradient(180deg, #a6ecff, var(--en) 60%, #136f9e); }
.bar.xp .fill { background: linear-gradient(180deg, #ffe7a3, var(--xp) 60%, #a0700f); }
.bar .num {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink);
  font-variant-numeric: tabular-nums;
}

/* Top-right: buttons */
.hud-top-right {
  position: absolute; right: calc(14px + var(--safe-r)); top: calc(12px + var(--safe-t));
  display: flex; gap: 8px; align-items: center; transform-origin: top right; transform: scale(var(--ui-scale));
}
.net-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 5px; border-radius: 999px;
  font: 900 12px var(--font-ui); color: var(--parch); font-variant-numeric: tabular-nums;
  background: rgba(20, 12, 36, 0.72); border: 2px solid var(--ink); box-shadow: 0 2px 0 var(--ink);
}
.net-chip i { width: 8px; height: 8px; border-radius: 50%; background: #4dff9a; box-shadow: 0 0 0 2px var(--ink); }
.net-chip.ok i { background: #ffd23d; }
.net-chip.bad i { background: #ff5a4d; }
.net-chip .pl { color: var(--text-dim); }
@container stage (max-width: 520px) {
  .net-chip .pl { display: none; }
  /* Four buttons leave no room beside the name: the chip drops under them. */
  .hud-top-right { flex-wrap: wrap; justify-content: flex-end; max-width: 190px; row-gap: 6px; }
  .net-chip { order: 9; }
}
/* Narrow phones: mute lives in the settings (Ajustes → Sonido) so the life bar keeps its room. */
@container stage (max-width: 420px) { #hud-mute { display: none; } }

/* Party frames (online): below the player's bars, gold and world clock, scaled together. */
.party {
  position: absolute; left: calc(14px + var(--safe-l)); top: calc(12px + var(--safe-t) + 138px * var(--ui-scale));
  display: grid; gap: 6px; transform-origin: top left; transform: scale(var(--ui-scale)); pointer-events: none;
}
.party .pm {
  display: flex; gap: 7px; align-items: center; padding: 4px 9px 5px 5px; border-radius: 10px;
  background: rgba(20, 12, 36, 0.7); border: 2px solid var(--ink); box-shadow: inset 3px 0 0 var(--pc), 0 2px 0 var(--ink);
}
.party .pw { width: 22px; height: 22px; display: grid; place-items: center; }
.party .pw svg { width: 20px; height: 20px; }
.party .pn { font-weight: 900; font-size: 12px; color: #9dffc8; text-shadow: 0 1px 0 var(--ink); white-space: nowrap; }
.party .pn .lv { color: var(--brass-l); margin-right: 5px; }
.party .bar.thin { width: 118px; height: 8px; margin-top: 2px; }
.party .pm.dead { filter: grayscale(1) brightness(0.75); }
.party .pm.dead .pn::after { content: ' · caído'; color: #ff8a80; }
.nameplate.ally .np-name { color: #9dffc8; }
.nameplate.ally .np-hp i { background: linear-gradient(180deg, #a6ffcf, #2fd17a); }

/* Lost connection veil */
.net-lost { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(8, 6, 20, 0.62); backdrop-filter: blur(3px); }
.net-card { max-width: 420px; padding: 22px 24px 24px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.net-card h2 { margin: 0; font-family: var(--font-display); font-size: 26px; letter-spacing: 0.03em; }
.net-card p { margin: 0; font-weight: 800; color: var(--parch); text-shadow: 0 2px 0 var(--ink); }

/* Zone banner */
#zone-banner {
  position: absolute; left: 50%; top: calc(18px + var(--safe-t));
  transform: translateX(-50%);
  display: grid; justify-items: center; gap: 2px;
  text-align: center; opacity: 0;
}
#zone-banner .zname { font-family: var(--font-display); font-size: clamp(28px, 5cqw, 46px); line-height: 1; }
#zone-banner .zsub { font-weight: 800; font-size: 14px; letter-spacing: 0.06em; color: var(--parch); text-shadow: 0 2px 0 var(--ink); text-transform: uppercase; }
#zone-banner .zline { width: 0; height: 4px; border-radius: 2px; background: var(--brass); box-shadow: 0 0 0 2px var(--ink); margin-top: 4px; }
#zone-banner.lawless .zline { background: #e0302a; }
#zone-banner.lawless .zsub { color: #ffc2b8; }
/* La Cala Calavera (M4.5): the chip by your gold and red edges on the screen. */
.law-chip { margin-left: 6px; padding: 1px 8px 2px; border-radius: 999px; font-size: 11.5px; font-weight: 900; letter-spacing: 0.05em; color: #fff3ee; background: #a3201e; box-shadow: 0 0 0 2px var(--ink), 0 0 10px rgba(255, 60, 40, 0.6); animation: lawPulse 1.6s ease-in-out infinite; }
@keyframes lawPulse { 50% { box-shadow: 0 0 0 2px var(--ink), 0 0 18px rgba(255, 60, 40, 0.95); } }
.law-vig { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.8s; background: radial-gradient(ellipse at center, transparent 58%, rgba(150, 10, 10, 0.32) 100%); }
.law-vig.on { opacity: 1; }
.nameplate.hostile .np-name { color: #ff8a7a; }
.nameplate.hostile .np-name::before { content: '☠ '; }
.nameplate.hostile .np-hp i { background: linear-gradient(#ff5a4a, #b3261e); }
.loot-label .pub { color: #ff9a8a; font-weight: 800; font-size: 0.85em; }

/* Bottom-center: action bar */
.actionbar {
  position: absolute; left: 50%; bottom: calc(14px + var(--safe-b));
  transform: translateX(-50%) scale(var(--ui-scale)); transform-origin: bottom center;
  display: flex; gap: 8px; padding: 8px 10px 10px;
}
.slot {
  position: relative; width: 58px; height: 58px; border-radius: 12px;
  background: radial-gradient(circle at 50% 30%, #3a2a5a, #1c1232);
  border: 2px solid var(--ink);
  box-shadow: inset 0 0 0 2px var(--brass-d), inset 0 2px 0 rgba(255, 220, 160, 0.3), 0 3px 0 var(--ink);
  display: grid; place-items: center; overflow: hidden;
}
.slot svg { width: 30px; height: 30px; }
.slot .key { position: absolute; left: 3px; top: 3px; transform: scale(0.85); transform-origin: top left; }
.slot .sweep { position: absolute; inset: 0; border-radius: 10px; pointer-events: none; }
.slot .charges { position: absolute; bottom: 4px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; }
.slot .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--ink); box-shadow: 0 0 6px var(--accent); }
.slot .pip.empty { background: #2a2040; box-shadow: none; }
.slot.locked svg { opacity: 0.35; }
.slot .lock {
  position: absolute; right: 3px; bottom: 3px;
  font-family: var(--font-display); font-size: 11px; color: var(--parch);
  background: rgba(10, 6, 24, 0.75); border: 1.5px solid var(--brass-d); border-radius: 6px; padding: 0 4px;
}
.slot.flash { animation: slotflash 0.25s ease; }
@keyframes slotflash { 0% { box-shadow: inset 0 0 0 2px var(--accent), 0 0 18px var(--accent); } 100% { box-shadow: inset 0 0 0 2px var(--brass-d), 0 3px 0 var(--ink); } }
.slot.denied { animation: denied 0.3s ease; }
@keyframes denied { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* Right: tracker */
.tracker {
  position: absolute; right: calc(14px + var(--safe-r)); top: calc(80px + var(--safe-t));
  width: 250px; padding: 10px 12px 12px;
  transform-origin: top right; transform: scale(var(--ui-scale));
}
.tracker h3 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: 0.04em; color: var(--brass-l); text-shadow: 0 2px 0 var(--ink); }
.tracker ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.tracker li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; align-items: start; font-weight: 700; font-size: 13.5px; line-height: 1.3; color: var(--text); text-shadow: 0 1px 0 var(--ink); }
.tracker li .chk { width: 16px; height: 16px; margin-top: 1px; border-radius: 4px; border: 2px solid var(--brass); background: rgba(0, 0, 0, 0.35); }
.tracker li.done { color: var(--text-dim); }
.tracker li.done .txt { text-decoration: line-through; text-decoration-color: rgba(255, 240, 200, 0.5); }
.tracker li.done .chk { background: var(--good); border-color: var(--ink); box-shadow: inset 0 0 0 2px #fff6; }

/* World-space prompts and nameplates */
#world-ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.nameplate {
  position: absolute; left: 0; top: 0; transform-origin: 50% 100%;
  display: grid; justify-items: center; gap: 2px;
  white-space: nowrap; will-change: transform;
}
.nameplate .np-name { font-weight: 900; font-size: 13px; color: #fff; text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 0 var(--ink); }
.nameplate .np-name .lv { color: var(--brass-l); margin-right: 4px; }
.nameplate .np-title { font-size: 11px; font-weight: 800; color: var(--brass-l); text-shadow: 0 1px 0 var(--ink); }
.nameplate .np-hp { width: 54px; height: 6px; border-radius: 3px; background: rgba(10, 6, 24, 0.8); border: 1.5px solid var(--ink); overflow: hidden; }
.nameplate .np-hp i { display: block; height: 100%; background: var(--good); }
.nameplate.npc .np-name { color: #fff2b8; }
.nameplate.you .np-name { color: var(--accent); }
.prompt {
  position: absolute; left: 0; top: 0;
  display: flex; gap: 8px; align-items: center;
  padding: 7px 12px 8px; white-space: nowrap;
  font-weight: 800; font-size: 14px;
  transform-origin: 50% 100%;
}
.prompt.below { padding: 6px 11px 7px; font-size: 13.5px; }
.prompt .arrow { position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; transform: translateX(-50%) rotate(45deg); background: #26173f; border-right: 2px solid var(--brass-d); border-bottom: 2px solid var(--brass-d); }
.bubble {
  position: absolute; left: 0; top: 0; max-width: 260px; padding: 9px 12px 10px;
  color: var(--ink); font-weight: 800; font-size: 13.5px; line-height: 1.35; white-space: normal;
  background: var(--parch); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink);
  transform-origin: 50% 100%;
}
.bubble b { display: block; font-family: var(--font-display); font-weight: 400; color: #8a2a1e; letter-spacing: 0.03em; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; transform: translateX(-50%) rotate(45deg); background: var(--parch); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }

/* Toasts (left, under the portrait) */

/* ---- Combat (M2) ------------------------------------------------------------------------------- */
.bar.en .fill { background: linear-gradient(180deg, #c8fbff, var(--accent) 55%, #0f8fa6); transition: width 0.15s ease; }

@keyframes hplow { 50% { filter: brightness(1.45); } }
.bar.hp.hurt { animation: hurtshake 0.25s ease; }
@keyframes hurtshake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.slot .combo { position: absolute; bottom: 4px; left: 0; right: 0; display: flex; justify-content: center; gap: 3px; }
.slot .combo i { width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg); background: #2a2040; border: 1.5px solid var(--ink); }

.r-slot { overflow: hidden; }
.r-slot .rfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(0deg, rgba(59, 240, 255, 0.55), rgba(59, 240, 255, 0.15)); transition: height 0.2s ease; }
.r-slot svg { position: relative; }

#chain {

}

/* Floating numbers and callouts */

/* Comic onomatopoeia (M4.7, Ultra): a word with a thick ink outline that pops 0.4 -> 1.15 -> 1 in 120 ms, holds, fades.
   The float is moved by JS (transform); the tilt (inline `rotate`) and the pop live on the inner span. */
.fnum.ono { font-size: calc(42px * var(--ui-scale, 1)); line-height: 1; text-shadow: none; animation: none; }
.fnum.ono.big { font-size: calc(66px * var(--ui-scale, 1)); }

  position: relative; display: block; font-weight: 900; font-synthesis: none; text-transform: uppercase; letter-spacing: 0.02em;
  color: #ffd23d; -webkit-text-stroke: calc(6px * var(--ui-scale, 1)) var(--ink); paint-order: stroke fill;
  filter: drop-shadow(calc(3px * var(--ui-scale, 1)) calc(4px * var(--ui-scale, 1)) 0 var(--ink));
}
.fnum.ono.big .ono-w { color: #ff6a3d; }
.ono-burst { position: absolute; left: 50%; top: 50%; width: 205%; height: 290%; translate: -50% -50%; z-index: -1; overflow: visible; }
.ono-burst polygon { fill: #fff; stroke: var(--ink); stroke-width: 4; stroke-linejoin: miter; }
@keyframes onopop { 0% { scale: 0.4; } 60% { scale: 1.15; } 100% { scale: 1; } }

/* ---- M2.5: boss bar + encounter line ---- */
#boss-bar { position: absolute; left: 50%; top: calc(14px + var(--safe-t)); transform: translateX(-50%); width: min(560px, calc(100cqw - 32px)); display: grid; gap: 4px; justify-items: center; pointer-events: none; }

#boss-bar .bbar .ghost { background: #fff3c9; opacity: 0.8; transition: width 0.6s ease 0.3s; }
#boss-bar .bbar .fill { background: linear-gradient(180deg, #ff8a3a, #c7341b); transition: width 0.12s; }

#boss-bar .bbar .num { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 11px; color: #fff; text-shadow: 0 1px 0 var(--ink), 0 0 3px var(--ink); }
#boss-bar .bstate { font-weight: 800; font-size: 12px; letter-spacing: 0.06em; color: var(--parch); text-shadow: 0 2px 0 var(--ink); }
#boss-bar .bstate .sh { color: #c9a6ff; } #boss-bar .bstate .br { color: #3bf0ff; }
#boss-bar.shield .bbar .fill { background: linear-gradient(180deg, #b48cff, #6a3fd0); }
#boss-bar.broken .bbar { box-shadow: 0 0 0 2.5px var(--ink), 0 0 14px 3px rgba(59, 240, 255, 0.6); }
#boss-bar.inv .bbar .fill { filter: saturate(0.3) brightness(1.3); }
#enc-info { position: absolute; left: 50%; top: calc(14px + var(--safe-t)); transform: translateX(-50%); font-weight: 900; font-size: 15px; letter-spacing: 0.08em; color: #ffd27a; text-transform: uppercase; white-space: nowrap; pointer-events: none; }
.boss-on #enc-info { top: calc(84px + var(--safe-t)); font-size: 13px; }
.boss-on #zone-banner { top: calc(108px + var(--safe-t)); }
.nameplate.minor .np-hp { width: 44px; height: 5px; }

/* ---- Weapons (M3.5) ------------------------------------------------------------------------------ */
.slot .ico { display: grid; place-items: center; position: relative; }
.slot .cd {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--font-display); font-size: 20px; color: #fff;
  text-shadow: 0 2px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink);
}

.actionbar .wname {
  position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 4px; white-space: nowrap;
  font-family: var(--font-display); font-size: 14px; letter-spacing: 0.04em; color: var(--brass-l);
  text-shadow: 0 2px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink);

/* ---- Loot and progress (M4) ------------------------------------------------------------------------ */
.gold-row { display: flex; align-items: center; gap: 5px; font-family: var(--font-display); font-size: 15px; color: #ffe08a; line-height: 1; margin-top: 1px; }
.gold-row .coin svg { width: 16px; height: 16px; display: block; }
.gold-row .gold-n { font-weight: 400; display: inline-block; font-variant-numeric: tabular-nums; }
.gold-row .tier-chip {
  margin-left: 6px; padding: 2px 7px 3px; border-radius: 999px; font-size: 11px; letter-spacing: 0.04em; color: #ffd1a0;
  background: rgba(120, 30, 10, 0.75); border: 1.5px solid var(--ink); box-shadow: 0 0 8px rgba(255, 90, 30, 0.45);
}
.hud-top-right .icon-btn { position: relative; }
.hud-top-right .icon-btn .dot { position: absolute; right: 3px; top: 3px; width: 9px; height: 9px; border-radius: 50%; background: #ffcf4a; border: 2px solid var(--ink); }
/* The weapon's mastery: a thin bar under its name */
.actionbar .mast {
  position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 22px;
  width: 150px; height: 9px; border-radius: 5px; background: rgba(20, 10, 30, 0.75); border: 1.5px solid var(--ink); overflow: hidden; pointer-events: auto;
}

.actionbar .mast .mtxt { position: absolute; inset: -1px 0 0; display: grid; place-items: center; font: 900 7.5px var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); }
.actionbar .wname { margin-bottom: 34px; }
/* Locked skills: a padlock and the mastery that opens them */
.slot .lock { right: auto; bottom: auto; inset: 0; display: grid; place-items: center; background: rgba(10, 6, 24, 0.55); border: 0; border-radius: 10px; padding: 0; z-index: 1; }
.slot .lock[hidden] { display: none; }
.slot .lock svg { width: 22px; height: 22px; opacity: 1; }
.slot .lock em { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font-style: normal; font-family: var(--font-display); font-size: 11px; color: var(--brass-l); text-shadow: 0 1px 0 var(--ink); }

/* Potions */

}

/* Loot labels on the ground, in their rarity's colour */
.loot-label {

  padding: 2px 8px 3px; border-radius: 7px; font-weight: 900; font-size: 12.5px; color: var(--rc, #fff);
  background: rgba(12, 8, 26, 0.72); border: 1.5px solid color-mix(in srgb, var(--rc, #fff) 55%, #1a1033);

}
.loot-label.gold, .loot-label.potion, .loot-label.quest { font-size: 11px; padding: 1px 6px 2px; background: rgba(12, 8, 26, 0.55); }
.loot-label.chest { font-family: var(--font-display); font-weight: 400; font-size: 15px; letter-spacing: 0.03em; }
.fnum.gold { color: #ffd24a; font-size: 16px; }
.toast .rz { text-shadow: 0 1px 0 var(--ink); }
.toast .legend { color: #ffc23d; letter-spacing: 0.06em; }
.tracker li.ready .chk { background: #ffcf4a; border-color: var(--ink); box-shadow: 0 0 8px #ffcf4a; }

@container stage (max-width: 760px) { .actionbar .mast { width: 120px; } }

/* ---- Touch controls v2 (M4.6): tinted glass, one colour per function --------------------------------------- */
/* --tb (set by touch.js) = the user's button size x an automatic factor; every size and offset scales with it. */
#touch { position: fixed; inset: 0; pointer-events: none; --tb: 1; }
#touch .joy-zone { position: absolute; left: 0; top: 30%; bottom: 0; width: 50%; pointer-events: auto; }
/* Where the stick usually appears: a faint ring (gone while it is live). */
#touch .joy-rest {
  position: absolute; left: calc(34px + var(--safe-l)); bottom: calc(34px + var(--safe-b));
  width: calc(104px * var(--tb)); height: calc(104px * var(--tb)); border-radius: 50%;
  border: 2px dashed rgb(255 255 255 / 0.2); transition: opacity 0.15s; pointer-events: none;
}
#touch .joy-rest::after { content: ''; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: rgb(255 255 255 / 0.24); }
#touch.stick .joy-rest { opacity: 0; }
#touch .joy {
  position: absolute; display: none; border-radius: 50%; pointer-events: none;
  width: calc(104px * var(--tb)); height: calc(104px * var(--tb)); margin: calc(-52px * var(--tb)) 0 0 calc(-52px * var(--tb));
  background: radial-gradient(circle, rgb(255 255 255 / 0.05), rgb(255 255 255 / 0.15) 100%);
  border: 2px solid rgb(255 255 255 / 0.38);
  box-shadow: 0 0 0 1.5px rgb(18 10 36 / 0.55), inset 0 2px 0 rgb(255 255 255 / 0.18), 0 4px 12px rgb(0 0 0 / 0.25);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
#touch .joy i {
  position: absolute; left: 50%; top: 50%; width: calc(46px * var(--tb)); height: calc(46px * var(--tb)); margin: calc(-23px * var(--tb)) 0 0 calc(-23px * var(--tb));
  border-radius: 50%; background: radial-gradient(circle at 40% 32%, #fff, #e4dff2 80%);
  border: 2.5px solid rgb(18 10 36 / 0.7); box-shadow: 0 3px 8px rgb(0 0 0 / 0.3);
}

/* The arc is centred on ATK (a zero-size box at its centre); each button sets its colour, size and offset. */
#touch .t-cluster {
  position: absolute; width: 0; height: 0; pointer-events: none;
  right: calc(18px + var(--safe-r) + 46px * var(--tb)); bottom: calc(18px + var(--safe-b) + 46px * var(--tb));
}
#touch .tbtn {
  --c: 255 255 255; --d: 60; --x: 0; --y: 0;
  position: absolute; left: calc(var(--x) * var(--tb) * 1px); top: calc(var(--y) * var(--tb) * 1px);
  width: calc(var(--d) * var(--tb) * 1px); height: calc(var(--d) * var(--tb) * 1px);
  margin: 0; padding: 0 0 calc(2px * var(--tb)); border-radius: 50%; pointer-events: auto; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(1px * var(--tb));
  font-family: var(--font-display); font-size: calc(10.5px * var(--tb)); line-height: 1; letter-spacing: 0.02em; color: #fff;
  background: radial-gradient(circle at 50% 32%, rgb(var(--c) / 0.36), rgb(var(--c) / 0.16) 72%);
  border: calc(2.5px * var(--tb)) solid rgb(var(--c) / 0.85);
  box-shadow: 0 0 0 1.5px rgb(18 10 36 / 0.55), inset 0 2px 0 rgb(255 255 255 / 0.22), 0 4px 12px rgb(0 0 0 / 0.25);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  transform: translate(-50%, -50%); transition: transform 60ms, background 60ms;
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
#touch .tbtn > * { pointer-events: none; }
#touch .tbtn.on { background: radial-gradient(circle at 50% 32%, rgb(var(--c) / 0.58), rgb(var(--c) / 0.26) 72%); transform: translate(-50%, -50%) scale(0.92); }
#touch .t-atk { --c: 255 98 64; --d: 92; }
#touch .t-dash { --c: 40 224 204; --d: 70; --x: -104; --y: 8; padding-bottom: calc(9px * var(--tb)); }
#touch .t-parry { --c: 84 156 255; --d: 62; --x: -6; --y: -104; }
#touch .t-q { --c: 176 112 255; --d: 58; --x: -172; --y: -34; }
#touch .t-e { --c: 176 112 255; --d: 58; --x: -124; --y: -124; }
#touch .t-r { --c: 255 204 64; --d: 54; --x: -34; --y: -172; }
#touch .t-g { --c: 255 121 59; --d: 54; --x: -208; --y: -138; }
.slot[data-slot='g'] { border-color: #ff793b; }
.slot[data-slot='g'].empty { opacity: 0.5; }
#touch .t-pot { --c: 255 84 128; --d: 48; --x: -262; --y: 14; padding: 0; }
#touch .t-act { --c: 255 172 40; --d: 64; --x: -118; --y: -232; }
#touch .t-parry .lbl, #touch .t-r .lbl { font-size: calc(9.5px * var(--tb)); }

/* Icon (~56 % of the button, white line over an ink under-stroke) and the short label under it. */
#touch .tbtn .ico { position: relative; width: 56%; aspect-ratio: 1; display: block; flex: none; }
#touch .t-pot .ico { width: 58%; }
#touch .tbtn svg { display: block; width: 100%; height: 100%; overflow: visible; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#touch .tbtn svg .u { stroke: #120a24; stroke-width: 4.2; }
#touch .tbtn svg .f { stroke: #fff; stroke-width: 2.2; }
#touch .tbtn .lbl {
  position: relative; display: block; min-height: 1em; white-space: nowrap; text-transform: uppercase;
  text-shadow: 1px 0 #120a24, -1px 0 #120a24, 0 1px #120a24, 0 -1px #120a24, 1px 1px #120a24, -1px 1px #120a24, 1px -1px #120a24, -1px -1px #120a24;
}
#touch .tbtn .lbl svg { width: auto; height: 1.15em; margin: 0 auto; }
/* Cooldown sweep (conic gradient set by touch.js) sits under the icon. */
#touch .tbtn .sweep { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
/* Dash charges: small dots along the bottom of the circle. */
#touch .t-dash .pips { position: absolute; left: 0; right: 0; bottom: calc(5px * var(--tb)); display: flex; justify-content: center; gap: calc(4px * var(--tb)); }
#touch .t-dash .pips i { width: calc(6px * var(--tb)); height: calc(6px * var(--tb)); border-radius: 50%; background: #28e0cc; border: 1.5px solid #120a24; }
#touch .t-dash .pips i.empty { background: rgb(18 10 36 / 0.75); }
/* Potion: count badge top-right. */
#touch .t-pot .cnt {
  position: absolute; right: calc(-4px * var(--tb)); top: calc(-4px * var(--tb)); min-width: calc(19px * var(--tb)); height: calc(19px * var(--tb)); padding: 0 calc(4px * var(--tb));
  display: grid; place-items: center; border-radius: 999px; font: 400 calc(12px * var(--tb)) / 1 var(--font-display); color: #fff;
  background: rgb(255 84 128); border: 2px solid #120a24; text-shadow: 0 1px 0 #120a24;
}
#touch .t-pot.empty { opacity: 0.6; filter: grayscale(0.7); }
#touch .t-pot.empty .cnt { background: #5a4a66; }
/* Locked (mastery): grey, with the padlock instead of the label. */
#touch .tbtn.locked { filter: grayscale(1); opacity: 0.45; }
/* Cooldown over: one bright ring pulse. R with the RIPOSTE full: a slow gold glow. */
#touch .tbtn.ready-flash::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid rgb(var(--c)); pointer-events: none; animation: tflash 350ms ease-out forwards; }
@keyframes tflash { from { opacity: 1; transform: scale(0.96); } to { opacity: 0; transform: scale(1.3); } }
#touch .t-r.ready { animation: tready 1.5s ease-in-out infinite; }
@keyframes tready {
  0%, 100% { box-shadow: 0 0 0 1.5px rgb(18 10 36 / 0.55), inset 0 2px 0 rgb(255 255 255 / 0.22), 0 0 6px 1px rgb(255 204 64 / 0.35); }
  50% { box-shadow: 0 0 0 1.5px rgb(18 10 36 / 0.55), inset 0 2px 0 rgb(255 255 255 / 0.22), 0 0 20px 7px rgb(255 204 64 / 0.85); }
}
/* The action button pops in when there is something to do. */
#touch .t-act.pop { animation: tpop 180ms cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes tpop { from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

#touch .aimline { position: absolute; height: 6px; margin-top: -3px; transform-origin: 0 50%; display: none; pointer-events: none;
  background: linear-gradient(90deg, rgba(59, 240, 255, 0.15), rgba(59, 240, 255, 0.9)); border-radius: 3px; box-shadow: 0 0 10px rgba(59, 240, 255, 0.6); }
#touch .aimline i { position: absolute; right: -8px; top: -5px; border: 8px solid transparent; border-left: 12px solid rgba(160, 250, 255, 0.95); border-right: 0; }
#touch .aimline.cancel { background: rgba(255, 80, 70, 0.6); box-shadow: none; }

/* ---- Landscape HUD (M4.6): a short stage (a phone on its side) gets a compact HUD that leaves the bottom-right
   arc (~320 x 340 px) and the joystick corner free ---------------------------------------------------------- */
@container stage (max-height: 480px) {
  .hud-player { top: calc(8px + var(--safe-t)); left: calc(10px + var(--safe-l)); gap: 8px; }
  .portrait { width: 58px; height: 58px; border-width: 3px; }
  .lvl-badge { min-width: 24px; height: 24px; padding: 0 5px; font-size: 13px; border-radius: 12px; right: -5px; bottom: -3px; }
  .bars { gap: 3px; min-width: 0; }
  .pname { font-size: 15px; }
  .bar { width: 160px; height: 13px; }
  .bar.thin { width: 140px; height: 11px; }
  .bar .num { font-size: 10px; } .bar.thin .num { font-size: 8.5px; }
  .gold-row { font-size: 13px; }
  .gold-row .coin svg { width: 14px; height: 14px; }
  .party { top: calc(8px + var(--safe-t) + 110px * var(--ui-scale)); }
  .party .pm { padding: 3px 8px 3px 4px; }
  /* The left column (portrait, crew, tracker, toasts) is the only one the arc and the stick leave free:
     toasts are narrower, three at most, and sit under the folded tracker. */
  #toasts { top: calc(8px + var(--safe-t) + (114px + var(--party-n, 0) * 36px + var(--trk, 0px)) * var(--ui-scale)); left: calc(10px + var(--safe-l)); width: min(250px, 34cqw); gap: 5px; }
  .toast { padding: 5px 9px; font-size: 12.5px; }
  #toasts .toast:nth-child(n + 4) { display: none; }
  /* Banner and boss line sit higher and smaller at the top centre. */
  #zone-banner { top: calc(8px + var(--safe-t)); }
  #zone-banner .zname { font-size: clamp(22px, 3.6cqw, 32px); }
  #zone-banner .zsub { font-size: 12px; }
  #boss-bar { top: calc(8px + var(--safe-t)); }
  #enc-info { top: calc(8px + var(--safe-t)); font-size: 13px; }
  .boss-on #enc-info { top: calc(66px + var(--safe-t)); }
  .boss-on #zone-banner { top: calc(86px + var(--safe-t)); }
  /* The tracker folds to one line (title + the current objective, with an ellipsis) under the crew. */
  .tracker { left: calc(10px + var(--safe-l)); right: auto; top: calc(8px + var(--safe-t) + (110px + var(--party-n, 0) * 36px) * var(--ui-scale)); transform-origin: top left; width: min(250px, 34cqw); padding: 4px 10px 5px; align-items: baseline; gap: 8px; }
  .tracker h3 { flex: none; margin: 0; font-size: 13px; }
  .tracker ul { flex: 1; min-width: 0; gap: 0; }
  .tracker li { display: none; font-size: 12.5px; line-height: 1.2; grid-template-columns: 14px minmax(0, 1fr); gap: 5px; align-items: center; }
  .tracker li .chk { width: 13px; height: 13px; margin-top: 0; }
  .tracker li:not(.done) { display: grid; }
  .tracker li:not(.done) ~ li:not(.done) { display: none; }
  .tracker ul:not(:has(li:not(.done))) li:last-child { display: grid; }
  .tracker li .txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
/* (narrower than 720 px the tracker stays hidden, as before) */
@container stage (max-height: 480px) and (min-width: 721px) { .tracker { display: flex; } #hud { --trk: 36px; } }

/* ---- Tattoos in the slots (M4.7) ---------------------------------------------------------------- */
.skill-slot.tattoo { box-shadow: inset 0 0 0 2px #8a5cff, inset 0 2px 0 rgba(210, 180, 255, 0.35), 0 3px 0 var(--ink); }
.slot .rk {
  position: absolute; right: 4px; top: 2px; z-index: 2; pointer-events: none;
  font-family: var(--font-display); font-size: 11px; line-height: 1; color: #d9c6ff;
  text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink);
}
.slot .fm {
  position: absolute; right: 3px; bottom: 3px; z-index: 2; pointer-events: none;
  width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center;
  font: 900 10px/1 var(--font-display); font-style: normal; color: var(--ink);
  background: #c9a8ff; box-shadow: 0 0 0 1.5px var(--ink);
}
.slot .rk[hidden], .slot .fm[hidden] { display: none; }

/* styles/panels.css */
#pause {
  position: fixed; inset: 0; z-index: 30;
  display: grid; place-items: center;
  padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  background: rgba(8, 6, 20, 0.55);
  backdrop-filter: blur(3px);
}
.panel { width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 18px 20px 20px; display: grid; gap: 14px; }

.panel .tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.panel .tab {
  font-family: var(--font-display); font-size: 15px; letter-spacing: 0.04em; color: var(--parch);
  background: rgba(20, 10, 30, 0.45); border: 2px solid var(--ink); border-radius: 10px; padding: 5px 12px; cursor: pointer;
}
.panel .tab[aria-selected='true'] { background: linear-gradient(180deg, var(--brass-l), var(--brass)); color: var(--ink); }
.panel .section { display: grid; gap: 10px; padding: 12px 14px; background: rgba(20, 10, 30, 0.42); border-radius: 10px; box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 12px; align-items: center; font-weight: 800; }

.row label { color: var(--text); text-shadow: 0 1px 0 var(--ink); }
.row input[type='range'] { width: 100%; accent-color: var(--brass); }

}
.row input[type='checkbox'] { width: 22px; height: 22px; accent-color: var(--brass); justify-self: start; }
.panel .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.controls-list .soon { color: var(--text-dim); font-weight: 700; font-size: 0.9em; }
.confirm { display: grid; gap: 10px; justify-items: center; text-align: center; font-weight: 800; }

/* F4 debug panel */
.devpanel {
  position: fixed; right: calc(14px + var(--safe-r)); top: calc(70px + var(--safe-t)); z-index: 25;
  width: min(320px, calc(100cqw - 32px)); max-height: calc(100cqh - 100px); overflow: auto;
  padding: 10px 12px 12px; display: grid; gap: 8px; pointer-events: auto; font-size: 13px;
}
.devpanel h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--brass-l); display: flex; gap: 8px; align-items: center; }
.devpanel .dv-btns { display: flex; flex-wrap: wrap; gap: 5px; }
.devpanel button {
  font: inherit; font-weight: 800; font-size: 12px; color: var(--ink); cursor: pointer;
  background: linear-gradient(180deg, var(--brass-l), var(--brass)); border: 2px solid var(--ink); border-radius: 8px; padding: 3px 8px;
}
.devpanel .dv-check { display: flex; gap: 8px; align-items: center; font-weight: 800; }
.devpanel .dv-check input { accent-color: var(--brass); width: 16px; height: 16px; }
.devpanel .dv-sliders { display: grid; gap: 6px; }
.devpanel .dv-slider { display: grid; gap: 2px; font-weight: 700; }
.devpanel .dv-slider span { display: flex; justify-content: space-between; gap: 8px; color: var(--text); }
