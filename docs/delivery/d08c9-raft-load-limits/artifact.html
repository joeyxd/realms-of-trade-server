.devpanel .dv-note { margin: 0; color: var(--text-dim); font-size: 11.5px; }

/* ---- M4: the character panel, item cards, the stall, dialogs, the map ---------------------------------- */
#charpanel { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: flex; justify-content: flex-end; align-items: center; padding: calc(64px + var(--safe-t)) calc(14px + var(--safe-r)) calc(16px + var(--safe-b)) 14px; }
.cp { pointer-events: auto; width: min(720px, 100%); height: min(640px, 100%); display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 10px 12px 12px; gap: 8px; }
.cp-head { display: flex; align-items: center; gap: 8px; }
.cp-head .tabs { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
.cp-pearls { padding: 4px 12px 12px; }
.cp-pearls h4 { margin: 16px 0 8px; color: var(--brass-l); }
.pearl-list { display: grid; gap: 12px; }
.pearl-card { padding: 12px; border: 2px solid var(--pearl); border-radius: 12px; background: rgba(20, 10, 30, 0.68); }
.pearl-card.swallowed { box-shadow: inset 0 0 24px #ff793b18; }
.pearl-card p { font-size: 13px; line-height: 1.5; margin: 8px 0; }
.pearl-card .tt-head b { color: var(--pearl); }
.pearl-card .tt-head { display: flex; align-items: center; gap: 10px; }
.pearl-card .tt-head b, .pearl-card .tt-head small { display: block; }
.pearl-card .tt-head small { color: var(--text-dim); margin-top: 3px; }
.pearl-curse { color: #ffbba2; }
.pearl-confirm { color: #ffe39d; background: #ff793b18; padding: 8px; border-radius: 8px; }
.pearl-empty { color: var(--text-dim); font-size: 13px; }
.pearl-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pearl-actions .btn { font-size: 12px; white-space: normal; min-height: 44px; }
.pearl-give { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pearl-give select { background: #241b33; color: var(--parch); border: 1px solid var(--pearl); border-radius: 6px; padding: 6px; }
.cp-head .tab { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.03em; color: var(--parch); background: rgba(20, 10, 30, 0.5); border: 2px solid var(--ink); border-radius: 10px; padding: 4px 10px; cursor: pointer; }
.cp-head .tab[aria-selected='true'] { background: linear-gradient(180deg, var(--brass-l), var(--brass)); color: var(--ink); }
.cp-head .tab .kbd { transform: scale(0.8); margin-left: 2px; }
.cp-x { width: 2.2em; height: 2.2em; font-size: 15px; }
.cp-body { overflow: auto; min-height: 0; padding: 2px; }
.cp-empty, .cp-hint { margin: 6px 0; color: var(--text-dim); font-weight: 800; font-size: 13px; text-align: center; }
.cp-gear { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 10px; height: 100%; }
.cp-left, .cp-right { background: rgba(20, 10, 30, 0.45); border-radius: 10px; box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45); padding: 10px; display: grid; gap: 8px; align-content: start; }
/* The paper doll: six slots around your portrait */
.doll { position: relative; height: 250px; }
.cp-portrait { position: absolute; left: 50%; top: 50%; width: 104px; height: 104px; transform: translate(-50%, -50%); border-radius: 50%; overflow: hidden; border: 4px solid var(--brass); box-shadow: 0 0 0 3px var(--ink), 0 4px 10px var(--shadow); }
.cp-portrait canvas { width: 100%; height: 100%; display: block; }
.doll-slot { position: absolute; width: 58px; height: 58px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; padding: 0;
  background: radial-gradient(circle at 50% 30%, #3a2a5a, #1c1232); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--rc, var(--brass-d)), 0 3px 0 var(--ink); }
.doll-slot svg { width: 32px; height: 32px; }
.doll-slot svg.ghost { opacity: 0.5; }
.doll-slot span { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 900; color: var(--text-dim); text-shadow: 0 1px 0 var(--ink); white-space: nowrap; }
.doll-slot.r3, .doll-slot.r4, .bag-cell.r3, .bag-cell.r4 { box-shadow: inset 0 0 0 2px var(--rc), 0 0 12px color-mix(in srgb, var(--rc) 70%, transparent), 0 3px 0 var(--ink); }
.doll-slot.top { left: 50%; top: 0; transform: translateX(-50%); }
.doll-slot.left { left: 0; top: 54px; } .doll-slot.left2 { left: 0; top: 140px; }
.doll-slot.right { right: 0; top: 54px; } .doll-slot.right2 { right: 0; top: 140px; }
.doll-slot.bottom { left: 50%; bottom: 14px; transform: translateX(-50%); }
.doll-slot.sel, .bag-cell.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.cp-mini { display: flex; justify-content: space-around; font-weight: 900; font-size: 12px; color: var(--text-dim); }
.cp-mini b { color: var(--parch); font-size: 14px; }
/* The bag */
.bag-head { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--brass-l); }
.bag-head small { font-family: var(--font-ui); font-weight: 800; color: var(--text-dim); }
.bag-head .cp-gold { margin-left: auto; color: #ffe08a; }
.bag-head .cp-pot { color: #ffb0a0; font-size: 14px; }
.cp-right { grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
.bag-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
.bag-cell { position: relative; aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; padding: 0; cursor: pointer;
  background: radial-gradient(circle at 50% 30%, #3a2a5a, #1c1232); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--rc, #2a2040), 0 2px 0 var(--ink); }
.bag-cell.empty { cursor: default; opacity: 0.45; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5); }
.bag-cell svg { width: 62%; height: 62%; }
.bag-cell .lv { position: absolute; left: 4px; bottom: 2px; font: 900 10px var(--font-ui); font-style: normal; color: var(--text-dim); text-shadow: 0 1px 0 var(--ink); }
.bag-cell .new { position: absolute; right: -3px; top: -5px; font: 400 9px var(--font-display); letter-spacing: 0.04em; color: var(--ink); background: #ffcf4a; border: 1.5px solid var(--ink); border-radius: 5px; padding: 0 3px; }
/* The item card */
/* The card keeps the bag still: it scrolls in its own box and its buttons stay in view. */
.cp-detail { min-height: 0; overflow: auto; overscroll-behavior: contain; }
.item-card { display: grid; gap: 6px 12px; align-content: start; padding: 9px 10px; border-radius: 10px; background: rgba(12, 8, 26, 0.85); border: 2px solid color-mix(in srgb, var(--rc) 70%, #1a1033); box-shadow: inset 0 0 18px color-mix(in srgb, var(--rc) 18%, transparent); }
.ic-head { display: flex; gap: 8px; align-items: center; }
.ic-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 9px; background: rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 0 2px var(--rc); }
.ic-icon svg { width: 30px; height: 30px; }
.ic-name { display: block; color: var(--rc); font-size: 15px; text-shadow: 0 1px 0 var(--ink); }
.ic-head small { color: var(--text-dim); font-weight: 800; font-size: 11.5px; }
.ic-stats, .ic-cmp ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; align-content: start; font-weight: 800; font-size: 12.5px; }
.ic-stats li { color: var(--parch); }
.ic-stats li.bad { color: #ff9a8a; }
.ic-cmp h5 { margin: 2px 0 2px; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.ic-cmp li.up { color: #8dff9a; } .ic-cmp li.down { color: #ff8a80; }
.ic-cmp .same, .ic-kit, .ic-value { margin: 0; font-size: 12px; font-weight: 800; color: var(--text-dim); }
.ic-kit { color: #9ff6ff; }
.ic-value b { color: #ffe08a; }
.item-card.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.item-card > :not(.ic-stats, .ic-cmp) { grid-column: 1 / -1; }
.ic-acts { display: flex; gap: 8px; flex-wrap: wrap; position: sticky; bottom: -9px; margin: 0 -10px -9px; padding: 6px 10px 8px; background: linear-gradient(180deg, rgba(12, 8, 26, 0), rgba(12, 8, 26, 0.96) 35%); border-radius: 0 0 10px 10px; }
.ic-acts .btn { font-size: 14px; padding: 0.35em 0.9em 0.4em; }
/* Tía Perla's stall */
.shop { display: grid; gap: 8px; }
.shop h4, .cp-quests h4 { margin: 2px 0; font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--brass-l); text-shadow: 0 2px 0 var(--ink); }
.shop-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px; border-radius: 10px; background: rgba(12, 8, 26, 0.55); }
.shop-row b { display: block; } .shop-row small { color: var(--text-dim); font-weight: 800; font-size: 11.5px; }
.shop-row.locked b { color: var(--text-dim); }
.shop-row .btn { font-size: 14px; padding: 0.35em 0.8em 0.4em; white-space: nowrap; }
.shop-note { margin: 0; font-size: 12px; font-weight: 800; color: var(--text-dim); }
/* Atributos */
.cp-stats { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.st-table { display: grid; gap: 3px; align-content: start; background: rgba(20, 10, 30, 0.45); border-radius: 10px; padding: 8px 10px; }
.st-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; font-weight: 800; font-size: 13px; padding: 2px 0; border-bottom: 1px solid rgba(255, 240, 200, 0.08); }
.st-row b { color: var(--parch); text-align: right; } .st-row small { grid-column: 1 / -1; color: var(--text-dim); font-size: 11px; }
.st-row small:empty { display: none; }
.st-side { display: grid; gap: 8px; align-content: start; }
.mast-card { display: grid; gap: 5px; padding: 8px 10px; border-radius: 10px; background: rgba(20, 10, 30, 0.45); }
.mc-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 900; }
.mc-head b { font-family: var(--font-display); font-weight: 400; color: var(--brass-l); font-size: 15px; }
.mast-card .bar.thin { width: 100%; }
.mast-card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 12px; font-weight: 700; color: var(--text-dim); }
.mast-card li.ok { color: var(--parch); } .mast-card li.ok b { color: var(--good); } .mast-card li b { color: var(--brass-d); margin-right: 4px; }
.mast-card small { color: var(--text-dim); font-weight: 800; font-size: 11px; }
.tiers { display: flex; gap: 6px; flex-wrap: wrap; }
.tiers span { padding: 2px 8px; border-radius: 999px; font-weight: 900; font-size: 12px; background: rgba(0, 0, 0, 0.35); color: var(--text-dim); border: 1.5px solid #3a2a56; }
.tiers span.ok { color: #ffd1a0; border-color: #a0401a; background: rgba(120, 30, 10, 0.55); }
/* Misiones */
.cp-quests { display: grid; gap: 8px; }
.q-card { padding: 8px 10px; border-radius: 10px; background: rgba(20, 10, 30, 0.5); display: grid; gap: 4px; border-left: 4px solid var(--brass); }
.q-card b { font-family: var(--font-display); font-weight: 400; font-size: 15px; color: var(--brass-l); }
.q-card p { margin: 0; font-weight: 700; font-size: 13px; }
.q-card small { color: var(--text-dim); font-weight: 800; font-size: 11.5px; }
.q-card .bar.thin { width: 100%; }
.q-card.ready { border-left-color: #ffcf4a; box-shadow: 0 0 10px rgba(255, 207, 74, 0.25); }
.q-card.offer { border-left-color: var(--accent); opacity: 0.9; }
.q-done { margin: 0; padding-left: 18px; color: var(--text-dim); font-weight: 800; font-size: 12.5px; }
/* Talking to people */
#dialog { position: fixed; left: 0; right: 0; bottom: calc(110px + var(--safe-b)); z-index: 22; display: flex; justify-content: center; pointer-events: none; padding: 0 14px; }
.dlg { pointer-events: auto; width: min(560px, 100%); padding: 12px 14px; display: grid; gap: 8px; }
.dlg-who { font-family: var(--font-display); font-size: 20px; }
.dlg-line { margin: 0; font-weight: 700; font-size: 14.5px; line-height: 1.4; }
.dlg-q { display: grid; gap: 3px; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(12, 8, 26, 0.6); }
.dlg-q b { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--brass-l); }
.dlg-q small { color: #ffe08a; font-weight: 800; }
.dlg-opts { display: flex; gap: 8px; flex-wrap: wrap; }
.dlg-opts .btn { font-size: 14px; padding: 0.4em 0.9em 0.45em; }
/* The map */
#mapview { position: fixed; inset: 0; z-index: 24; display: grid; place-items: center; background: rgba(8, 6, 20, 0.5); padding: calc(16px + var(--safe-t)) 14px calc(16px + var(--safe-b)); }
.mapv { width: min(680px, 100%); max-height: 100%; display: grid; gap: 8px; padding: 10px 12px 12px; grid-template-rows: auto minmax(0, 1fr) auto; }
.mapv-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); font-size: 20px; }
.mapv-body { position: relative; aspect-ratio: 1; max-height: calc(100cqh - 150px); margin: 0 auto; width: 100%; max-width: calc(100cqh - 150px); border-radius: 12px; overflow: hidden; border: 3px solid var(--ink); box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5); }
.mapv-body canvas { width: 100%; height: 100%; display: block; }
.mapv-labels span { position: absolute; transform: translate(-50%, -160%); font-family: var(--font-display); font-size: 13px; color: var(--parch); white-space: nowrap; text-shadow: 0 2px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); pointer-events: none; }
.mapv-legend { display: flex; gap: 14px; justify-content: center; font-weight: 800; font-size: 12px; }
.mapv-legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; border: 2px solid var(--ink); vertical-align: -1px; }
.mapv-legend .law::before { background: rgba(200, 30, 30, 0.6); border-color: #ff5a4a; border-style: dashed; }
.mapv-labels span.lawless { color: #ff8a7a; transform: translate(-50%, 0); }
.mapv-legend .me::before { background: #3bf0ff; } .mapv-legend .crew::before { background: #9dffc8; } .mapv-legend .npc::before { background: #ffe39a; } .mapv-legend .goal::before { background: #ffcf4a; box-shadow: 0 0 6px #ffcf4a; }
@container stage (max-width: 760px) {
  #charpanel { padding: calc(10px + var(--safe-t)) 8px calc(10px + var(--safe-b)); justify-content: center; }
  .cp-gear, .cp-stats { grid-template-columns: minmax(0, 1fr); }
  .doll { height: 220px; } .doll-slot { width: 50px; height: 50px; }
  .cp-gear { height: auto; } .cp-detail { overflow: visible; }
  .bag-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .cp-head .tab .kbd { display: none; }
  #dialog { bottom: calc(14px + var(--safe-b)); }
}

/* ---- Tatuajes (M4.7) ------------------------------------------------------------------------------- */
.cp-tattoo { display: grid; gap: 8px; }
.tt-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; background: rgba(20, 10, 30, 0.45); border-radius: 10px; box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45); padding: 8px 10px; }
.tt-weapon b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--brass-l); text-shadow: 0 2px 0 var(--ink); }
.tt-weapon small { color: var(--text-dim); font-weight: 800; font-size: 12px; }
.tt-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tt-slot { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 2px 8px; text-align: left; padding: 6px 8px; min-height: 56px; border-radius: 10px; border: 2px solid var(--ink); background: radial-gradient(circle at 30% 20%, #3a2a5a, #1c1232); color: var(--parch); cursor: pointer; }
.tt-slot.tattoo { box-shadow: inset 0 0 0 2px #8a5cff; }
.tt-slot .kbd { grid-row: 1 / 3; }
.tt-slot .tt-ico { grid-row: 1 / 3; }
.tt-slot .tinta { grid-column: 3; width: auto; }
.tt-ico svg { width: 32px; height: 32px; display: block; }
.tt-name { display: grid; line-height: 1.15; min-width: 0; }
.tt-name b { font-size: 14px; }
.tt-name small { color: var(--text-dim); font-weight: 800; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt-body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 10px; }
.tt-list, .tt-detail { background: rgba(20, 10, 30, 0.45); border-radius: 10px; box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45); padding: 8px 10px; }
.tt-list h4 { margin: 2px 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 15px; color: var(--brass-l); text-shadow: 0 2px 0 var(--ink); }
.tt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-bottom: 8px; }
.tt-card .tt-name small { white-space: normal; }
.tt-card { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; padding: 6px 26px 6px 8px; min-height: 48px; border-radius: 10px; border: 2px solid var(--ink); background: rgba(40, 24, 60, 0.85); color: var(--parch); cursor: pointer; }
.tt-card.tattoo { box-shadow: inset 0 0 0 1.5px rgba(138, 92, 255, 0.75); }
.tt-card.locked { filter: grayscale(0.85); opacity: 0.7; }
.tt-card.unlearned:not(.locked) { box-shadow: inset 0 0 0 1.5px var(--brass-l); }
.tt-card.sel, .tt-slot.sel { outline: 3px solid var(--brass-l); outline-offset: 1px; }
.tt-card .rk { position: absolute; right: 6px; top: 4px; font: 400 12px var(--font-display); font-style: normal; color: #d9c6ff; text-shadow: 0 1px 0 var(--ink); }
.tt-card .in { position: absolute; right: 5px; bottom: 5px; font: 900 10px/1 var(--font-display); font-style: normal; color: var(--ink); background: var(--brass-l); border-radius: 4px; padding: 2px 4px; }
.tt-card-big .tt-head { display: flex; gap: 10px; align-items: center; }
.tt-card-big .tt-head .tt-ico svg { width: 44px; height: 44px; }
.tt-card-big .tt-head b { font-family: var(--font-display); font-size: 18px; font-weight: 400; color: var(--parch); }
.tt-card-big .tt-head small { display: block; color: var(--text-dim); font-weight: 800; font-size: 12px; }
.tt-hint { margin: 8px 0 4px; font-weight: 800; font-size: 13.5px; }
.tt-num { margin: 0 0 4px; font-size: 12.5px; color: #ffe0a8; font-weight: 700; }
.tt-how { margin: 0 0 8px; font-size: 12px; color: var(--text-dim); font-weight: 800; }
.tt-forms { display: grid; gap: 5px; margin-bottom: 8px; }
.tt-form { text-align: left; padding: 5px 8px; min-height: 44px; border-radius: 8px; border: 2px solid var(--ink); background: rgba(20, 10, 30, 0.6); color: var(--parch); cursor: pointer; }
.tt-form b { font-size: 13px; font-weight: 900; }
.tt-form small { display: block; color: var(--text-dim); font-size: 11.5px; font-weight: 800; }
.tt-form.on { background: linear-gradient(180deg, #6b46d8, #3f2590); box-shadow: inset 0 0 0 2px #c9a8ff; }
.tt-form.locked, .tt-form:disabled { opacity: 0.55; cursor: default; }
.tt-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tt-actions .btn { min-height: 44px; }
.tt-note { margin: 0; font-size: 11.5px; color: var(--text-dim); font-weight: 800; text-align: center; }
.tt-card-big.shake { animation: ttShake 0.35s; }
@keyframes ttShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@container stage (max-width: 760px) {
  .tt-body, .tt-top { grid-template-columns: minmax(0, 1fr); }
  .tt-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* styles/raft-editor.css */
.raft-editor {
  position: absolute; z-index: 42; right: 12px; top: 12px; width: min(310px, calc(100% - 24px));
  max-height: calc(100% - 24px); overflow: auto; box-sizing: border-box; padding: 12px;
  color: #f7e7bc; background: linear-gradient(145deg, rgb(33 27 26), rgb(15 22 26));
  border: 2px solid #b9894d; border-radius: 9px; box-shadow: 0 5px 0 #3a2923, 0 12px 35px #0009;
  font: 600 13px/1.25 system-ui, sans-serif; text-shadow: 0 1px #000; touch-action: manipulation; pointer-events: auto;
}
.raft-editor[hidden] { display: none; }
.building-raft #touch .t-cluster, .building-raft #touch .joy-rest { display: none; }
.building-raft #touch .joy-zone { top: auto; bottom: 0; height: 20%; width: 30%; }
.building-raft .actionbar, .building-raft .tracker, .building-raft .prompt { visibility: hidden; }
.raft-build-launcher[hidden] { display: none; }
.raft-build-launcher { position: absolute; z-index: 41; right: 18px; bottom: 82px; min-height: 46px; padding: 0 15px; border: 2px solid #d6a95b; border-radius: 7px; background: linear-gradient(#79542e, #513924); color: #fff0c3; font: 800 14px system-ui, sans-serif; text-shadow: 0 1px #000; box-shadow: 0 4px 0 #34231d, 0 8px 20px #0008; touch-action: manipulation; }
.raft-editor button, .raft-editor select { color: inherit; font: inherit; }
.raft-editor button { min-height: 34px; border: 1px solid #806447; border-radius: 5px; background: #383332; cursor: pointer; }
.raft-editor button:active { transform: translateY(1px); }
.raft-editor button:disabled { opacity: .48; cursor: default; }
.re-head, .re-options, .raft-editor footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.re-head { color: #f4bd65; letter-spacing: .07em; font-size: 12px; }
.raft-editor .re-close { width: 36px; min-height: 34px; font-size: 23px; line-height: 1; }
.re-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin: 8px 0; }
.raft-editor .re-tabs .on, .raft-editor [data-part].on { border-color: #f6c767; background: #674b30; box-shadow: inset 0 0 0 1px #e1ab54; }
.re-pieces { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.raft-editor .re-pieces button { display: flex; min-width: 0; min-height: 54px; padding: 4px 2px; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.re-pieces i { font-style: normal; color: #edc176; font-size: 20px; line-height: 1; }
.re-pieces span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
.re-details { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-height: 32px; margin: 7px 0; padding: 6px 7px; border-left: 3px solid #d39a54; background: #ffffff0b; }
.re-details small { text-align: right; color: #d6c6a5; font-size: 10px; }
.re-capacity { display: grid; gap: 4px; margin: 5px 0 7px; padding: 7px 8px; border: 1px solid #73c4c14a; border-radius: 6px; background: linear-gradient(110deg, #18323899, #ffffff08); }
.re-capacity > div { display: flex; justify-content: space-between; gap: 6px; color: #b9cbc4; font-size: 9px; }
.re-capacity > div b { color: #eee2c9; font-size: 9px; text-align: right; }
.re-capacity-kicker { color: #74cbc4; font-size: 8px; font-weight: 900; letter-spacing: .1em; }
.re-capacity-note { color: #a99f8d; font-size: 8px; }
.re-capacity-warning { color: #ffad99; font-size: 9px; font-weight: 800; }
.re-options { margin: 5px 0; }
.re-options label { display: flex; align-items: center; gap: 6px; }
.raft-editor select { min-height: 34px; background: #383332; border: 1px solid #806447; border-radius: 5px; padding: 0 7px; }
.raft-editor .re-rotate { padding: 0 10px; }
.re-status { min-height: 33px; margin: 5px 0; padding: 6px 7px; border-radius: 4px; background: #080d10a8; color: #dbe5d4; }
.re-supplies { display: flex; gap: 5px; }
.raft-editor .re-supplies button { flex: 1; min-height: 31px; border-color: #7a7652; background: #343a2e; color: #e4d79a; font-size: 10px; }
.re-supplies:empty { display: none; }
.re-remove-choice { display: flex; align-items: center; gap: 6px; min-height: 32px; color: #e9c88d; font-size: 11px; }
.raft-editor .re-cycle { min-height: 30px; padding: 3px 7px; }
.re-remove-choice span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.raft-editor footer { align-items: stretch; margin-top: 7px; }
.re-route { max-width: 54%; align-self: center; color: #b6ac98; font-size: 9px; }
.raft-editor .re-action { flex: 1; min-height: 42px; border-color: #ddb45e; background: linear-gradient(#79542e, #513924); color: #fff0c3; font-weight: 800; }
.raft-editor.is-reinforce .re-action { border-color: #91b9bf; background: linear-gradient(#386168, #24444a); color: #e7ffff; }
.raft-editor.is-reinforce .re-pieces, .raft-editor.is-reinforce .re-options { display: none; }
.raft-editor.is-remove .re-action { border-color: #cf8061; background: linear-gradient(#743e33, #4f2e2c); }
@media (max-width: 700px), (max-height: 430px) {
  .raft-build-launcher { right: 7px; bottom: 7px; min-height: 44px; padding: 0 11px; font-size: 12px; }
  .raft-editor { right: 5px; top: 5px; width: min(278px, calc(100% - 10px)); max-height: calc(100% - 10px); padding: 7px; font-size: 12px; }
  .re-head { font-size: 10px; }
  .raft-editor button { min-height: 32px; }
  .raft-editor .re-pieces { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
  .raft-editor .re-pieces button { min-height: 43px; }
  .re-pieces i { font-size: 17px; }
  .re-pieces span { font-size: 9px; }
  .re-details { min-height: 25px; margin: 4px 0; padding: 4px; }
  .re-details small { font-size: 9px; }
  .re-status { min-height: 25px; margin: 4px 0; padding: 4px; }
  .raft-editor .re-supplies button { min-height: 29px; font-size: 9px; }
  .re-route { font-size: 8px; }
  .raft-editor .re-action { min-height: 38px; }
}
@media (max-height: 430px) {
  .raft-editor { overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain; }
  .re-capacity { gap: 2px; margin: 3px 0 5px; padding: 5px 6px; }
  .re-capacity > div { align-items: baseline; }
  .re-capacity > div span { flex: 0 0 68px; }
  .re-capacity > div b { max-width: 72%; line-height: 1.15; }
  .re-capacity-kicker { font-size: 9px; }
  .re-capacity-note { font-size: 9px; line-height: 1.15; }
}

.trading-goods #touch .t-cluster, .trading-goods #touch .joy-rest { display: none; }

  position: absolute; z-index: 41; right: 18px; bottom: 18px; min-height: 46px; padding: 0 15px;
  border: 2px solid #dbb76b; border-radius: 7px; background: linear-gradient(#79552f, #493321);

.production-recipe span, .production-rate span, .production-progress span { flex: 0 0 auto; color: #a99b83; font-size: 10px; }
.production-recipe b, .production-rate b, .production-progress b { color: #e9dcc0; font-size: 11px; text-align: right; }

.production-progress progress::-webkit-progress-bar { background: #0e1115; }
.production-progress progress::-webkit-progress-value { border-radius: 6px; background: linear-gradient(90deg, #96703a, #f0ce7a); }
.production-progress progress::-moz-progress-bar { border-radius: 6px; background: linear-gradient(90deg, #96703a, #f0ce7a); }

.is-market .commerce-body { display: flex; flex-direction: column; gap: 8px; }
.is-market .market-wallet, .is-market .market-order { flex-shrink: 0; margin: 0; }

@container stage (max-height: 470px) {

/* styles/chat.css */
/* MAREA NEGRA chat: compact sea-glass surfaces above the action bar. */
.mn-chat {
  --chat-accent: #63e9f3;
  --chat-accent-soft: rgba(67, 218, 230, .2);
  position: fixed;
  z-index: 18;
  left: calc(14px + var(--safe-l));
  bottom: calc(104px + var(--safe-b));
  width: min(360px, calc(100% - 28px - var(--safe-l) - var(--safe-r)));
  color: #effcff;
  font: 700 13px/1.3 var(--font-ui, system-ui, sans-serif);
  pointer-events: none;
  user-select: text;
  -webkit-user-select: text;
}
.mn-chat[hidden], .mn-chat [hidden] { display: none !important; }
.mn-chat button, .mn-chat select, .mn-chat input { font: inherit; pointer-events: auto; touch-action: manipulation; }
.mn-chat[data-channel="local"] { --chat-accent: #9af0c4; --chat-accent-soft: rgba(115, 226, 170, .18); }
.mn-chat[data-channel="whisper"] { --chat-accent: #d6b9ff; --chat-accent-soft: rgba(184, 139, 255, .2); }

.mn-chat-toggle, .mn-chat-close, .mn-chat-send, .mn-chat-retry {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 40px;
  border: 1px solid rgba(177, 234, 248, .38);
  border-radius: 11px;
  color: #edfcff;
  background: linear-gradient(155deg, rgba(20, 69, 91, .96), rgba(8, 28, 49, .98));
  box-shadow: inset 0 1px 0 rgba(231, 252, 255, .13), 0 4px 12px rgba(0, 8, 20, .26);
  cursor: pointer;
  transition: background-color .14s ease, border-color .14s ease, transform .14s ease, box-shadow .14s ease;
}
.mn-chat-toggle { position: relative; min-width: 78px; padding: 6px 12px; pointer-events: auto; }
.mn-chat-toggle-label { font-weight: 900; letter-spacing: .02em; }
.mn-chat-toggle:hover, .mn-chat-close:hover, .mn-chat-retry:hover { border-color: rgba(154, 235, 246, .72); background: linear-gradient(155deg, rgba(31, 91, 112, .98), rgba(11, 39, 61, .99)); }
.mn-chat-toggle:active, .mn-chat-close:active, .mn-chat-send:active, .mn-chat-retry:active { transform: translateY(1px); }
.mn-chat-icon { width: 16px; height: 16px; flex: 0 0 auto; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mn-chat-badge { display: inline-grid; place-items: center; min-width: 19px; height: 19px; margin-left: 1px; padding: 0 4px; border: 1px solid rgba(255, 236, 184, .68); border-radius: 99px; color: #122d3c; background: linear-gradient(145deg, #ffe8ad, #ffc875); box-shadow: 0 2px 8px rgba(255, 199, 117, .24); font-size: 10px; font-weight: 900; }
.mn-chat-badge:empty { display: none; }

/* World-space player messages; kept separate from the parchment NPC bubble styles. */
.mn-chat-bubble {
  --bubble-accent: #69dce5;
  position: absolute;
  transform-origin: 50% 100%;
  z-index: 24;
  left: 0;
  top: 0;
  box-sizing: border-box;
  width: min(240px, calc(100cqw - 20px));
  padding: 7px 10px 8px;
  border: 1px solid rgba(151, 222, 232, .58);
  border-radius: 10px;
  color: #eaf8fa;
  background: linear-gradient(145deg, rgba(15, 48, 66, .96), rgba(5, 22, 39, .97));
  box-shadow: 0 3px 9px rgba(0, 8, 20, .32), inset 0 1px 0 rgba(231, 252, 255, .12);
  font: 700 12px/1.3 var(--font-ui, system-ui, sans-serif);
  pointer-events: none;
  overflow-wrap: anywhere;
  word-break: normal;
}
.mn-chat-bubble[data-channel="local"] { --bubble-accent: #9af0c4; border-color: rgba(154, 240, 196, .6); }
.mn-chat-bubble[data-channel="whisper"] { --bubble-accent: #d6b9ff; border-color: rgba(214, 185, 255, .62); }
.mn-chat-bubble.is-own { box-shadow: 0 3px 9px rgba(0, 8, 20, .32), inset 0 0 0 1px rgba(239, 199, 125, .38); }
.mn-chat-bubble-label {
  margin-bottom: 2px;
  overflow: hidden;
  color: var(--bubble-accent);
  font-size: 9px;
  line-height: 1.2;
  font-weight: 900;
  letter-spacing: .035em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mn-chat-bubble.is-own .mn-chat-bubble-label { color: #efc77d; }
.mn-chat-bubble-text {
  display: -webkit-box;
  max-height: calc(1.3em * 4);
  overflow: hidden;
  color: #eef8fa;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 4;
}
.mn-chat-bubble::after {
  content: '';
  position: absolute;
  left: var(--mn-chat-tail-x, 50%);
  bottom: -6px;
  width: 10px;
  height: 10px;
  transform: translateX(-50%) rotate(45deg);
  border-right: 1px solid rgba(151, 222, 232, .58);
  border-bottom: 1px solid rgba(151, 222, 232, .58);
  background: #09243a;
}
.mn-chat-bubble[data-channel="local"]::after { border-color: rgba(154, 240, 196, .6); }
.mn-chat-bubble[data-channel="whisper"]::after { border-color: rgba(214, 185, 255, .62); }
.mn-chat-bubble[hidden] { display: none !important; }
@container stage (max-width: 520px) {
  .mn-chat-bubble { width: min(220px, calc(100cqw - 16px)); padding: 6px 8px 7px; font-size: 11px; }
  .mn-chat-bubble-label { font-size: 8px; }
}
@container stage (max-height: 480px) {
  .mn-chat-bubble { width: min(216px, calc(100cqw - 14px)); padding: 5px 8px 6px; font-size: 10px; }
  .mn-chat-bubble-label { margin-bottom: 1px; }
}

.mn-chat-panel {
  width: 100%;
  height: min(300px, max(190px, calc(100cqh - 170px)));
  min-height: 0;
  margin-top: 7px;
  padding: 9px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  gap: 7px;
  overflow: hidden;
  border: 1px solid rgba(158, 220, 238, .38);
  border-radius: 14px;
  background:
    radial-gradient(ellipse at 8% 0%, rgba(47, 173, 194, .19), transparent 55%),
    linear-gradient(145deg, rgba(13, 46, 69, .74), rgba(6, 20, 39, .82) 66%, rgba(13, 29, 52, .78));
  box-shadow: 0 8px 24px rgba(0, 6, 18, .34), inset 0 1px 0 rgba(239, 252, 255, .1), inset 0 0 0 1px rgba(8, 22, 40, .28);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  pointer-events: auto;
  animation: mn-chat-enter .16s ease-out both;
}
@keyframes mn-chat-enter { from { opacity: 0; transform: translateY(5px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
.mn-chat-header { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mn-chat-heading { min-width: 0; display: grid; gap: 0; }
.mn-chat-eyebrow { color: #81dce5; font-size: 8px; line-height: 1.15; font-weight: 900; letter-spacing: .17em; }
.mn-chat-header strong { color: #f3fcff; font: 400 17px/1.1 var(--font-display, system-ui, sans-serif); letter-spacing: .01em; text-shadow: 0 1px 8px rgba(88, 220, 233, .16); }
.mn-chat-close { min-height: 36px; padding: 4px 8px; color: #d8eef4; font-size: 11px; }
.mn-chat-close .mn-chat-icon { width: 14px; height: 14px; }

.mn-chat-conversation { position: relative; min-height: 0; overflow: hidden; border: 1px solid rgba(148, 204, 220, .17); border-radius: 10px; background: linear-gradient(180deg, rgba(2, 15, 30, .36), rgba(5, 19, 34, .48)); }
.mn-chat-log { position: relative; z-index: 1; width: 100%; height: 100%; list-style: none; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(120, 196, 211, .48) transparent; margin: 0; padding: 7px; display: grid; align-content: start; gap: 5px; }
.mn-chat-log::-webkit-scrollbar { width: 6px; }
.mn-chat-log::-webkit-scrollbar-track { background: transparent; }
.mn-chat-log::-webkit-scrollbar-thumb { border: 1px solid rgba(6, 24, 40, .8); border-radius: 99px; background: rgba(120, 196, 211, .42); }
.mn-chat-line { position: relative; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 7px; overflow-wrap: anywhere; padding: 5px 7px 6px 9px; border: 1px solid rgba(145, 202, 218, .11); border-radius: 7px; background: linear-gradient(100deg, rgba(29, 71, 91, .38), rgba(13, 39, 59, .37)); }
.mn-chat-line::before { content: ''; position: absolute; inset: 5px auto 5px 0; width: 2px; border-radius: 0 3px 3px 0; background: var(--line-accent, #66dce6); opacity: .82; }
.mn-chat-world { --line-accent: #74e5ef; }
.mn-chat-local { --line-accent: #9ce8bc; }
.mn-chat-whisper { --line-accent: #cfadff; }
.mn-chat-line.is-own { border-color: rgba(231, 194, 123, .16); background: linear-gradient(100deg, rgba(95, 78, 50, .25), rgba(26, 49, 61, .3)); }
.mn-chat-line.is-own::before { background: #efc77d; }
.mn-chat-meta { align-self: center; color: #7ce3ec; font-size: 9px; line-height: 1.2; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; }
.mn-chat-local .mn-chat-meta { color: #a1edc0; }
.mn-chat-whisper .mn-chat-meta { color: #d5b8ff; }
.mn-chat-who { min-width: 0; overflow: hidden; color: #f0d59a; font-size: 10px; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
.mn-chat-text { grid-column: 1 / -1; white-space: pre-wrap; color: #e9f4f8; font-size: 12px; line-height: 1.35; }
.mn-chat-empty { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 4px; padding: 8px; color: #d8e9ef; text-align: center; }
.mn-chat-empty .mn-chat-icon { width: 22px; height: 22px; margin-bottom: 1px; color: #8bdde5; opacity: .9; }
.mn-chat-empty strong { color: #eefbff; font: 400 14px/1.1 var(--font-display, system-ui, sans-serif); }
.mn-chat-empty small { color: #a8c5d1; font-size: 10px; letter-spacing: .04em; }

.mn-chat-status { min-width: 0; min-height: 1.2em; max-height: 3.2em; overflow: auto; margin: 0; display: flex; align-items: flex-start; gap: 6px; color: #c0d8e0; font-size: 10px; line-height: 1.25; overflow-wrap: anywhere; scrollbar-width: thin; }
.mn-chat-status:not(:empty)::before { content: ''; flex: 0 0 5px; width: 5px; height: 5px; margin-top: 3px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
.mn-chat-status[data-tone="success"] { color: #9ce8bc; }
.mn-chat-status[data-tone="pending"] { color: #86dce9; }
.mn-chat-status[data-tone="warning"] { color: #f3cd86; }
.mn-chat-status[data-tone="error"] { color: #ff9eaa; }
.mn-chat-form { min-width: 0; display: grid; gap: 6px; }
.mn-chat-routing { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.mn-chat[data-channel="whisper"] .mn-chat-routing { grid-template-columns: 100px minmax(0, 1fr); gap: 6px; }
.mn-chat-compose { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.mn-chat-channel, .mn-chat-target, .mn-chat-input { min-width: 0; min-height: 42px; width: 100%; padding: 6px 9px; border: 1px solid rgba(148, 205, 220, .28); border-radius: 8px; color: #ecfaff; background-color: rgba(4, 19, 34, .82); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .2); }
.mn-chat-channel { color: var(--chat-accent); font-weight: 900; }
.mn-chat-target { color: #e8dcff; }
.mn-chat-channel option, .mn-chat-target option { color: #eaf7fb; background: #10283c; }
.mn-chat-input { padding-inline: 10px; color: #f4fbff; }
.mn-chat-input::placeholder { color: #98b2c0; opacity: 1; }
.mn-chat-send, .mn-chat-retry { min-width: 84px; min-height: 42px; padding: 5px 10px; border-color: var(--chat-accent); color: #062533; background: linear-gradient(145deg, var(--chat-accent), #187d92); box-shadow: inset 0 1px 0 rgba(255,255,255,.36), 0 3px 9px var(--chat-accent-soft); font-weight: 900; }
.mn-chat-send { border-color: color-mix(in srgb, var(--chat-accent) 62%, transparent); background: linear-gradient(145deg, color-mix(in srgb, var(--chat-accent) 90%, white), var(--chat-accent) 60%, color-mix(in srgb, var(--chat-accent) 65%, #187d92)); }
.mn-chat-send:hover:not(:disabled), .mn-chat-retry:hover:not(:disabled) { filter: brightness(1.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 4px 12px var(--chat-accent-soft); }
.mn-chat-send .mn-chat-icon, .mn-chat-retry .mn-chat-icon { width: 15px; height: 15px; }
.mn-chat-retry { color: #172137; background: linear-gradient(145deg, #e7d5ff, #cbb0f7 62%, #9875d1); border-color: rgba(226, 207, 255, .75); }
.mn-chat button:disabled { opacity: .53; cursor: default; filter: saturate(.6); }
.mn-chat select:focus-visible, .mn-chat input:focus-visible, .mn-chat button:focus-visible { outline: 2px solid #b5f7ff; outline-offset: 2px; border-color: #b5f7ff; }

@container stage (max-width: 520px) {
  .mn-chat { left: calc(8px + var(--safe-l)); bottom: calc(104px + var(--safe-b)); width: min(340px, calc(100% - 16px - var(--safe-l) - var(--safe-r))); }
  .mn-chat-panel { height: min(280px, max(190px, calc(100cqh - 170px))); padding: 8px; gap: 6px; }
}
@container stage (max-height: 480px) {
  .mn-chat { bottom: calc(94px + var(--safe-b)); }
  .mn-chat-panel { height: min(220px, max(180px, calc(100cqh - 160px))); padding: 6px; gap: 5px; }
  .mn-chat-header strong { font-size: 15px; }
  .mn-chat-close { min-height: 34px; }
  .mn-chat[data-channel="whisper"] .mn-chat-routing { gap: 5px; }
  .mn-chat-channel, .mn-chat-target, .mn-chat-input, .mn-chat-send, .mn-chat-retry { min-height: 38px; }
  .mn-chat-form, .mn-chat-compose { gap: 5px; }
  .mn-chat-status { font-size: 9px; }
}
@media (prefers-reduced-motion: reduce) {
  .mn-chat-panel { animation: none; }
  .mn-chat *, .mn-chat *::before, .mn-chat *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}

/* styles/naval-touch.css */
.naval-touch {
  position: absolute;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  color: #f2ead8;
  font: 600 10px/1.1 system-ui, sans-serif;
}

.naval-touch-stick {
  position: absolute;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: 104px;
  height: 104px;
  border-radius: 50%;
  pointer-events: auto;
  touch-action: none;
  display: grid;
  place-items: center;
  overflow: visible;
  background: radial-gradient(circle at 35% 27%, rgb(191 219 209 / 13%), rgb(8 21 26 / 56%) 72%);
  box-shadow: 0 8px 24px rgb(0 0 0 / 23%), inset 0 0 0 1px rgb(218 226 207 / 12%);
