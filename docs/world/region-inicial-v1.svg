  <text x="1208" y="1400" text-anchor="middle" class="small">Metal · componente raro · A4</text>
  <text x="65" y="147" class="small">Orientación propuesta ↑</text>
  <text x="65" y="171" class="note">No corresponde al norte del mapa actual</text>
  <text x="1208" y="1451" text-anchor="middle" class="note">Isla lejana · después de combate naval</text>
