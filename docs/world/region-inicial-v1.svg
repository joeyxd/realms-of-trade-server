  <text x="57" y="1581" class="small">Plano de diseño: las formas y distancias se ajustan tras medir el terreno, los recorridos y los cascos reales.</text>
  <text x="57" y="1609" class="note">Salty Shore, muelle, fuente, Caldera, Cala y recursos existentes conservan sus anclas; este dibujo no los traslada.</text>
