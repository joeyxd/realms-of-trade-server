<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1660" viewBox="0 0 1440 1660" role="img" aria-labelledby="title desc">
  <title id="title">Primera región de MAREA NEGRA: esquema provisional</title>
  <desc id="desc">Salty Shore y Puerto Sol comparten isla, camino y ruta costera. El interior contiene bosque, manantial y una rama hacia La Caldera. Cala es opcional y separada del camino principal. Bahía Ceniza está mucho más lejos, en otra isla tras una larga travesía de mar abierto con combate naval para llegar. Sin escala ni coordenadas de juego.</desc>
  <defs>
    <pattern id="sea" width="72" height="36" patternUnits="userSpaceOnUse"><path d="M8 20q12-8 24 0t24 0" fill="none" stroke="#b6e4e1" stroke-opacity=".16" stroke-width="2"/></pattern>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#183a3d}
      .title{font-size:32px;font-weight:700;fill:#f6ead0}.subtitle{font-size:17px;fill:#c5dfdb}
      .name{font-size:23px;font-weight:700}.small{font-size:17px}.note{font-size:15px}.zone{font-size:17px;font-weight:600;letter-spacing:1px}
      .city{fill:#fff2d2;stroke:#9d7144;stroke-width:3}.place{fill:#f1f4df;stroke:#637d49;stroke-width:2}
      .road{fill:none;stroke:#b7873b;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
      .branch{fill:none;stroke:#b7873b;stroke-width:5;stroke-dasharray:10 8;stroke-linecap:round}
      .sailing{fill:none;stroke:#126485;stroke-width:7;stroke-linecap:round}
      .later{fill:none;stroke:#126485;stroke-width:5;stroke-dasharray:12 9;stroke-linecap:round}
    </style>
  </defs>
