  <text x="982" y="675" text-anchor="middle" class="small">PvP · rama opcional</text>
  <rect x="515" y="619" width="221" height="62" rx="11" fill="#e4f0d5" stroke="#567e6c" stroke-width="2"/>
  <text x="625" y="646" text-anchor="middle" class="small">Ensenada de parada</text>
  <text x="625" y="669" text-anchor="middle" class="note">Sin mercado ni bodega remota</text>
  <path d="M623 682v24" fill="none" stroke="#567e6c" stroke-width="2"/>
  <text x="395" y="786" class="name" style="fill:#164d65">Ruta costera · mismo viaje</text>
  <text x="394" y="812" class="small" style="fill:#164d65">Bahías, maniobra y acceso real a tierra</text>
  <text x="192" y="984" class="name" style="fill:#f1ecd9;font-size:36px;letter-spacing:3px">MAR ABIERTO</text>
  <text x="193" y="1021" class="small" style="fill:#e2eff0">Travesía mucho más larga que la ruta a Sol</text>
  <text x="193" y="1051" class="small" style="fill:#e2eff0">Agua · comida · luz · reparación · armamento</text>
  <text x="193" y="1110" class="note" style="fill:#e2eff0">Distancia y duración por medir con carga y combate.</text>
  <text x="193" y="1136" class="note" style="fill:#e2eff0">Esta expansión no tiene que caber en la isla inicial.</text>
  <circle cx="1014" cy="1049" r="27" fill="#f1d6b0" stroke="#9d5142" stroke-width="3"/>
  <path d="M999 1060l28-22m-26-2 26 26m-28-22 5-4m18 30 5-4" fill="none" stroke="#9d5142" stroke-width="4" stroke-linecap="round"/>
