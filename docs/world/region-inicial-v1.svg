  <text x="1212" y="1043" text-anchor="middle" class="name">Combate naval</text>
  <text x="1212" y="1071" text-anchor="middle" class="small">PvE · antes de llegar</text>
  <path d="M1043 1049h40" fill="none" stroke="#f4e3c7" stroke-width="3"/>
  <text x="1042" y="1180" class="note" style="fill:#e2eff0">Encuentro propuesto · A6 / D10</text>
