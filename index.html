<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Marea Negra</title>
<meta name="description" content="Action-RPG isométrico en Three.js: isla tropical y la arena volcánica La Caldera.">
<meta name="theme-color" content="#0b1630">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="styles/vars.css">
<link rel="stylesheet" href="styles/title.css">
<link rel="stylesheet" href="styles/account.css">
<link rel="stylesheet" href="styles/wallet.css">
<link rel="stylesheet" href="styles/hud.css">
<link rel="stylesheet" href="styles/panels.css">
<link rel="stylesheet" href="styles/raft-editor.css">
<link rel="stylesheet" href="styles/commerce.css">
<link rel="stylesheet" href="styles/workbench.css">
<link rel="stylesheet" href="styles/community.css">
<link rel="stylesheet" href="styles/artisan.css">
<link rel="stylesheet" href="styles/workshop.css">
<link rel="stylesheet" href="styles/loggingTiming.css">
<link rel="stylesheet" href="styles/fire.css">
<link rel="stylesheet" href="styles/chat.css">
<link rel="stylesheet" href="styles/naval-touch.css">
<link rel="stylesheet" href="styles/liveNavigation.css">
<link rel="stylesheet" href="styles/minimap.css">
<link rel="stylesheet" href="styles/i18n.css">
</head>
<body>
<div id="stage">
<canvas id="game" tabindex="0" data-l10n-aria-label="runtime.gameView" aria-label="Vista del juego"></canvas>
<div id="ui">
  <div id="world-ui"></div>
  <div id="hud" hidden></div>
  <div id="title" hidden></div>
  <div id="charpanel" hidden></div>
  <div id="dialog" hidden></div>
  <div id="mapview" hidden></div>
  <div id="pause" hidden></div>
  <div id="touch" hidden></div>
  <div id="chat"></div>
  <pre id="perf" hidden></pre>
  <div id="devpanel" hidden></div>
</div>
<div id="fade" role="status" aria-live="polite"></div>
</div>
<div id="bootstrap-locale" class="language-picker" role="group" aria-label="Idioma / Language"><button type="button" lang="es" data-locale="es">Español</button><button type="button" lang="en" data-locale="en">English</button></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff6e2;background:#0b1630;font:700 18px system-ui;margin:0">Este juego necesita JavaScript. / This game requires JavaScript.</p></noscript>
<script>
// Bootstrap: pick a reachable CDN (jsdelivr, then unpkg), then install the import map and start.
(function () {
  // This selector has no module/CDN dependencies and remains available on a boot failure.
  var language, saved;
  try { saved = localStorage.getItem('mn.locale'); } catch (_) {}
  language = saved === 'es' || saved === 'en' ? saved : (navigator.languages || [navigator.language]).map(function (l) { return String(l).toLowerCase().split('-')[0]; }).find(function (l) { return l === 'es' || l === 'en'; }) || 'es';
  var failure = null;
  var failures = {
    load: ['No se pudo cargar el juego. Revisa tu conexión y recarga la página.', 'Could not load the game. Check your connection and reload the page.'],
    start: ['Algo falló al iniciar el juego. Recarga la página para intentarlo de nuevo.', 'The game could not start. Reload the page to try again.']
  };
  window.__mnLocale = function (code) {
    language = code; window.__mnLanguage = code; document.documentElement.lang = code;
    document.querySelectorAll('#bootstrap-locale [data-locale]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.locale === code)); });
    document.querySelector('meta[name="description"]').content = code === 'en' ? 'Isometric action RPG in Three.js: a tropical island and the volcanic La Caldera arena.' : 'Action-RPG isométrico en Three.js: isla tropical y la arena volcánica La Caldera.';
    if (failure) document.getElementById('fade').textContent = failures[failure][code === 'en' ? 1 : 0];
  };
  window.__mnLocale(language);
  document.querySelectorAll('#bootstrap-locale [data-locale]').forEach(function (button) { button.addEventListener('click', function () {
    try { localStorage.setItem('mn.locale', button.dataset.locale); } catch (_) {}
    window.__mnLocale(button.dataset.locale);
    document.dispatchEvent(new CustomEvent('mn:locale', { detail: button.dataset.locale }));
  }); });
  var CDNS = [
    { three: 'https://cdn.jsdelivr.net/npm/three@0.160.0/', gsap: 'https://cdn.jsdelivr.net/npm/gsap@3.12.5/' },
    { three: 'https://unpkg.com/three@0.160.0/', gsap: 'https://unpkg.com/gsap@3.12.5/' }
  ];
  function probe(url, ms) {
    return new Promise(function (resolve) {
      var l = document.createElement('link');
      l.rel = 'preload'; l.as = 'script'; l.crossOrigin = 'anonymous'; l.href = url;
      var t = setTimeout(function () { resolve(false); }, ms);
      l.onload = function () { clearTimeout(t); resolve(true); };
      l.onerror = function () { clearTimeout(t); resolve(false); };
      document.head.appendChild(l);
    });
  }
  function fail(msg) {
    failure = Object.keys(failures).find(function (key) { return failures[key].includes(msg); }) || 'start';
    var f = document.getElementById('fade');
    f.style.display = 'grid'; f.style.placeItems = 'center'; f.style.color = '#fff6e2';
    f.style.font = '800 16px Nunito, system-ui, sans-serif'; f.style.textAlign = 'center'; f.style.padding = '16px';
    f.textContent = failures[failure][language === 'en' ? 1 : 0];
    document.getElementById('bootstrap-locale').hidden = false;
  }
  (async function () {
    var pick = CDNS[0];
    for (var i = 0; i < CDNS.length; i++) {
      if (await probe(CDNS[i].three + 'build/three.module.js', 3500)) { pick = CDNS[i]; break; }
    }
    var im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({ imports: {
      'three': pick.three + 'build/three.module.js',
      'three/addons/': pick.three + 'examples/jsm/',
      'gsap': pick.gsap + 'index.js'
    } });
    document.head.appendChild(im);
    var m = document.createElement('script');
    m.type = 'module';
    m.src = 'src/main.js';
    m.onerror = function () { fail('No se pudo cargar el juego. Revisa tu conexión y recarga la página.'); };
    document.body.appendChild(m);
    window.__mnFail = fail;
  })();
})();
</script>
</body>
</html>
